<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>GEO OEM · 代理商后台</title>
<style>
/* ==========================================================================
   GEO OEM Enterprise Design System — Unified Admin & Portal Theme
   ========================================================================== */
:root {
  --tenant-color: #1664ff;
  --blue: var(--tenant-color, #1664ff);
  --brand-hover: color-mix(in srgb, var(--blue) 86%, #06142e);
  --tint: color-mix(in srgb, var(--blue) 9%, #ffffff);
  --tint-strong: color-mix(in srgb, var(--blue) 15%, #ffffff);
  --brand-border: color-mix(in srgb, var(--blue) 26%, #ffffff);
  --brand-ring: color-mix(in srgb, var(--blue) 16%, transparent);

  --ink: #0f1d35;
  --ink-soft: #1e314f;
  --muted: #5a6d87;
  --subtle: #8496ae;
  --line: #e3eaf4;
  --line-strong: #d0dceb;
  --bg: #f4f7fc;
  --surface: #ffffff;
  --surface-subtle: #f8fafd;

  --green: #067647;
  --green-bg: #ecfdf5;
  --green-bd: #bbf7d0;
  --amber: #b45309;
  --amber-bg: #fffbeb;
  --amber-bd: #fde68a;
  --red: #be123c;
  --red-bg: #fff1f2;
  --red-bd: #fecdd3;

  --radius-sm: 8px;
  --radius-md: 11px;
  --radius-lg: 16px;
  --radius-xl: 20px;

  --shadow-xs: 0 1px 2px rgba(15, 29, 53, 0.035);
  --shadow-sm: 0 2px 8px -2px rgba(15, 29, 53, 0.05), 0 1px 3px rgba(15, 29, 53, 0.03);
  --shadow-md: 0 10px 28px -6px rgba(15, 29, 53, 0.08), 0 2px 6px rgba(15, 29, 53, 0.04);
  --shadow-dialog: 0 28px 90px -12px rgba(9, 20, 44, 0.28), 0 0 0 1px rgba(15, 29, 53, 0.06);

  --font: Inter, -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
}

*, *::before, *::after {
  box-sizing: border-box;
}

html {
  scroll-behavior: smooth;
}

body {
  margin: 0;
  color: var(--ink);
  font: 14px/1.6 var(--font);
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  background-color: var(--bg);
  background-image:
    radial-gradient(1000px 380px at 68% -60px, color-mix(in srgb, var(--blue) 7%, transparent), transparent 70%),
    radial-gradient(700px 320px at 15% -40px, rgba(56, 189, 248, 0.05), transparent 65%);
  background-attachment: fixed;
}

/* Custom Subtle Scrollbars */
::-webkit-scrollbar { width: 7px; height: 7px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 999px; }
::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

a {
  color: var(--blue);
  text-decoration: none;
  transition: color 0.16s ease, background-color 0.16s ease, border-color 0.16s ease;
}

h1, h2, h3, p {
  margin: 0;
}

h1 {
  font-size: 25px;
  font-weight: 700;
  letter-spacing: -0.025em;
  line-height: 1.28;
  color: var(--ink);
}

h2 {
  font-size: 16px;
  font-weight: 650;
  letter-spacing: -0.012em;
  color: var(--ink);
}

h3 {
  font-size: 15px;
  font-weight: 650;
  color: var(--ink);
}

.muted, small {
  color: var(--muted);
}

small {
  font-size: 12px;
  line-height: 1.45;
}

button, input, select, textarea {
  font: inherit;
}

button {
  cursor: pointer;
}

button:disabled {
  cursor: not-allowed;
  opacity: 0.5;
}

button:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, summary:focus-visible {
  outline: 2px solid var(--blue);
  outline-offset: 2px;
}

/* ==========================================================================
   App Shell: Sidebar & Sticky Glass Topbar
   ========================================================================== */
.layout {
  display: grid;
  grid-template-columns: 240px minmax(0, 1fr);
  min-height: 100vh;
}

.sidebar {
  position: sticky;
  top: 0;
  height: 100vh;
  display: flex;
  flex-direction: column;
  background: linear-gradient(180deg, #ffffff 0%, #fafcff 100%);
  border-right: 1px solid var(--line);
  box-shadow: 4px 0 24px rgba(15, 29, 53, 0.02);
  padding: 22px 14px 16px;
  overflow-y: auto;
  z-index: 35;
}

.brand {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 2px 10px 22px;
  margin-bottom: 4px;
  border-bottom: 1px solid #eef3f9;
  color: var(--ink);
}

.mark {
  min-width: 40px;
  height: 40px;
  border-radius: 11px;
  background: linear-gradient(140deg, color-mix(in srgb, var(--blue) 90%, #5cb8ff), var(--brand-hover));
  box-shadow:
    inset 0 1px 0 rgba(255, 255, 255, 0.35),
    0 6px 14px -3px color-mix(in srgb, var(--blue) 36%, transparent);
  display: grid;
  place-items: center;
  color: #ffffff;
  font-weight: 800;
  font-size: 18px;
  letter-spacing: -0.02em;
  flex-shrink: 0;
}

.brand b {
  font-size: 18px;
  font-weight: 750;
  line-height: 1.22;
  letter-spacing: -0.02em;
  color: var(--ink);
  display: block;
  overflow-wrap: anywhere;
}

html[style*="--tenant-color"] .brand b {
  color: var(--blue);
}

.brand small {
  display: inline-block;
  margin-top: 3px;
  font-size: 11px;
  font-weight: 500;
  color: var(--muted);
  letter-spacing: 0.04em;
}

.nav {
  padding-top: 8px;
}

.nav-label {
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--subtle);
  padding: 16px 12px 6px;
}

.nav a, .nav button {
  position: relative;
  display: flex;
  align-items: center;
  justify-content: flex-start;
  gap: 11px;
  width: 100%;
  padding: 9px 12px;
  min-height: 40px;
  margin-bottom: 3px;
  color: #415572;
  font-size: 13.5px;
  font-weight: 500;
  border: 1px solid transparent;
  border-radius: 10px;
  background: transparent;
  text-align: left;
  transition: all 0.16s cubic-bezier(0.16, 1, 0.3, 1);
}

.nav a i, .nav button i {
  font-style: normal;
  display: inline-grid;
  place-items: center;
  width: 20px;
  height: 20px;
  flex: none;
  color: #6b7f99;
  transition: color 0.16s ease, transform 0.16s ease;
}

.nav a i svg, .nav button i svg {
  width: 18px;
  height: 18px;
}

.nav a:hover, .nav button:hover {
  background: #f2f6fc;
  color: var(--ink);
  border-color: transparent;
}

.nav a:hover i, .nav button:hover i {
  color: var(--blue);
}

.nav a[aria-current="page"], .nav button[aria-current="page"] {
  background: var(--tint);
  color: var(--blue);
  font-weight: 650;
  border-color: color-mix(in srgb, var(--blue) 14%, transparent);
  box-shadow: 0 1px 3px color-mix(in srgb, var(--blue) 6%, transparent);
}

.nav a[aria-current="page"]::before, .nav button[aria-current="page"]::before {
  content: "";
  position: absolute;
  left: -7px;
  top: 9px;
  bottom: 9px;
  width: 3.5px;
  border-radius: 999px;
  background: var(--blue);
}

.nav a[aria-current="page"] i, .nav button[aria-current="page"] i {
  color: var(--blue);
}

.side-foot {
  margin-top: auto;
  padding: 16px 2px 0;
}

.side-foot > div {
  display: flex;
  align-items: center;
  gap: 11px;
  padding: 11px 12px;
  background: var(--surface-subtle);
  border: 1px solid var(--line);
  border-radius: 12px;
}

.side-avatar {
  position: relative;
  width: 34px;
  height: 34px;
  display: grid;
  place-items: center;
  flex: none;
  background: linear-gradient(135deg, var(--tint-strong), var(--tint));
  border: 1px solid var(--brand-border);
  color: var(--blue);
  border-radius: 50%;
  font-weight: 700;
  font-size: 13px;
}

.side-avatar::after {
  content: "";
  position: absolute;
  right: -1px;
  bottom: -1px;
  width: 9px;
  height: 9px;
  border-radius: 50%;
  background: #10b981;
  border: 2px solid #ffffff;
}

.side-foot b {
  display: block;
  color: var(--ink);
  font-size: 13px;
  font-weight: 650;
  line-height: 1.3;
}

.side-foot small {
  display: block;
  font-size: 11px;
  color: var(--subtle);
  margin-top: 1px;
}

.topbar {
  position: sticky;
  top: 0;
  z-index: 25;
  min-height: 60px;
  padding: 10px 32px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 14px;
  background: rgba(255, 255, 255, 0.84);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  border-bottom: 1px solid rgba(227, 234, 244, 0.92);
}

.path {
  display: flex;
  gap: 8px;
  align-items: center;
  font-size: 13px;
}

.path-label {
  color: var(--muted);
  font-weight: 500;
}

.path-sep {
  color: #a1b2c8;
  font-size: 14px;
}

.topbar .path b {
  color: var(--ink);
  font-weight: 650;
}

main {
  max-width: 1480px;
  margin: 0 auto;
  padding: 26px 32px 52px;
}

/* ==========================================================================
   Headers: Hero Workspace Cover & Clean Subpage Header
   ========================================================================== */
.intro, .section-head, .actions, .filters {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  flex-wrap: wrap;
}

.actions, .filters {
  justify-content: flex-start;
}

.intro:not(.workspace-cover) {
  margin: 0 0 16px;
  padding: 2px 0;
  background: transparent;
  border: 0;
  border-radius: 0;
  box-shadow: none;
  position: relative;
}

.intro:not(.workspace-cover)::before {
  display: none;
}

.intro:not(.workspace-cover) h1 {
  font-size: 20px;
  letter-spacing: -0.02em;
}

.intro p, .section-head p {
  margin-top: 4px;
  font-size: 13px;
}

.workspace-cover {
  position: relative;
  isolation: isolate;
  overflow: hidden;
  display: flex;
  align-items: center;
  min-height: 188px;
  padding: 28px 32px;
  margin-bottom: 20px;
  background:
    radial-gradient(ellipse at 86% 24%, color-mix(in srgb, var(--blue) 42%, #0ea5e9) 0%, transparent 56%),
    radial-gradient(ellipse at 65% 110%, rgba(14, 165, 233, 0.22), transparent 52%),
    linear-gradient(118deg, #071529 0%, #0b2240 58%, #10335c 100%);
  border: 1px solid rgba(56, 130, 246, 0.28);
  border-radius: var(--radius-xl);
  box-shadow: 0 14px 34px -10px rgba(8, 24, 54, 0.28), inset 0 1px 0 rgba(255, 255, 255, 0.1);
  color: #ffffff;
}

.workspace-cover h1 {
  font-size: clamp(24px, 2.6vw, 32px);
  line-height: 1.22;
  margin: 10px 0 8px;
  color: #ffffff;
  letter-spacing: -0.025em;
}

.workspace-cover p {
  margin: 0;
  color: #bfd4ee;
  font-size: 14px;
  max-width: 560px;
}

.cover-copy, .cover-action {
  position: relative;
  z-index: 1;
}

.cover-action {
  margin-top: 18px;
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
}

.cover-label {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  padding: 4px 11px;
  border-radius: 999px;
  background: rgba(255, 255, 255, 0.08);
  border: 1px solid rgba(255, 255, 255, 0.15);
  color: #bae6fd;
  font-size: 11.5px;
  font-weight: 600;
  letter-spacing: 0.05em;
  backdrop-filter: blur(6px);
}

.cover-label::before {
  content: "";
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: #38bdf8;
  box-shadow: 0 0 8px #38bdf8;
}

.cover-grid {
  position: absolute;
  inset: 0 0 0 42%;
  z-index: -1;
  opacity: 0.72;
  pointer-events: none;
  background:
    radial-gradient(circle, rgba(152, 223, 255, 0.45) 1px, transparent 1.5px) 0 0 / 24px 24px,
    repeating-linear-gradient(135deg, transparent 0 68px, rgba(119, 194, 255, 0.09) 69px 70px, transparent 71px 112px);
  mask-image: linear-gradient(90deg, transparent, #000 50%);
  -webkit-mask-image: linear-gradient(90deg, transparent, #000 50%);
}

.cover-grid::after {
  content: "";
  position: absolute;
  width: 380px;
  height: 120px;
  right: 3%;
  bottom: -26px;
  transform: rotate(-16deg);
  border: 1px solid rgba(148, 209, 247, 0.35);
  border-radius: 50%;
  box-shadow: 0 0 0 18px rgba(115, 197, 255, 0.04), 0 0 0 38px rgba(115, 197, 255, 0.03);
}

/* Cover light secondary buttons (e.g. return link inside dark cover) */
.workspace-cover .button:not(.primary) {
  background: rgba(255, 255, 255, 0.1);
  border-color: rgba(255, 255, 255, 0.22);
  color: #ffffff;
  backdrop-filter: blur(6px);
}
.workspace-cover .button:not(.primary):hover {
  background: rgba(255, 255, 255, 0.18);
  border-color: rgba(255, 255, 255, 0.38);
  color: #ffffff;
}

/* ==========================================================================
   Buttons & Action Links
   ========================================================================== */
.button, button {
  display: inline-flex;
  justify-content: center;
  align-items: center;
  gap: 6px;
  border: 1px solid var(--line-strong);
  border-radius: 9px;
  background: var(--surface);
  color: var(--ink-soft);
  font-size: 13px;
  font-weight: 600;
  padding: 7px 14px;
  min-height: 36px;
  white-space: nowrap;
  box-shadow: var(--shadow-xs);
  transition: all 0.16s cubic-bezier(0.16, 1, 0.3, 1);
}

.button:hover, button:hover {
  border-color: var(--blue);
  color: var(--blue);
  background: #fbfdff;
}

.button:active, button:active {
  transform: translateY(0.5px);
}

.primary, button.primary {
  background: linear-gradient(180deg, color-mix(in srgb, var(--blue) 94%, #ffffff) 0%, var(--blue) 100%);
  border-color: var(--blue);
  color: #ffffff;
  box-shadow:
    inset 0 1px 0 rgba(255, 255, 255, 0.22),
    0 4px 12px -2px color-mix(in srgb, var(--blue) 38%, transparent);
}

.primary:hover, button.primary:hover {
  background: linear-gradient(180deg, var(--blue) 0%, var(--brand-hover) 100%);
  border-color: var(--brand-hover);
  color: #ffffff;
  box-shadow:
    inset 0 1px 0 rgba(255, 255, 255, 0.22),
    0 6px 16px -2px color-mix(in srgb, var(--blue) 48%, transparent);
}

.cover-action .primary {
  box-shadow:
    inset 0 1px 0 rgba(255, 255, 255, 0.28),
    0 8px 22px rgba(10, 30, 82, 0.45);
}

.link-button {
  border: 1px solid transparent;
  color: var(--blue);
  padding: 4px 9px;
  min-height: 28px;
  font-size: 12.5px;
  font-weight: 600;
  background: var(--tint);
  border-radius: 7px;
  box-shadow: none;
}

.link-button:hover {
  background: var(--tint-strong);
  border-color: var(--brand-border);
  color: var(--brand-hover);
}

.order-preview {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 4px 9px;
  min-height: 28px;
  border-radius: 7px;
  font-size: 12.5px;
  font-weight: 600;
  color: var(--ink-soft);
  background: #f3f6fb;
  border: 1px solid var(--line);
  white-space: nowrap;
}

.order-preview:hover {
  color: var(--blue);
  background: var(--tint);
  border-color: var(--brand-border);
}

.cell-actions {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  flex-wrap: wrap;
}

/* ==========================================================================
   Panels, KPI Metrics & Progress Bars
   ========================================================================== */
.panel, .metric {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-sm);
}

.panel {
  margin-bottom: 18px;
  overflow: hidden;
}

.pad {
  padding: 20px 22px;
}

.section-head {
  margin-bottom: 14px;
}

.panel > .pad:has(+ .scroll) {
  padding-bottom: 14px;
}

.metrics {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 14px;
  margin-bottom: 20px;
}

.metric {
  position: relative;
  padding: 18px 20px;
  min-height: 114px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  overflow: hidden;
  transition: transform 0.18s ease, box-shadow 0.18s ease, border-color 0.18s ease;
}

.metric:hover {
  transform: translateY(-2px);
  box-shadow: var(--shadow-md);
  border-color: var(--brand-border);
}

.metric::before {
  content: "";
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  height: 3px;
  background: linear-gradient(90deg, var(--blue), #38bdf8);
  opacity: 0.85;
}

.metric:nth-child(2)::before { background: linear-gradient(90deg, #10b981, #34d399); }
.metric:nth-child(3)::before { background: linear-gradient(90deg, #f59e0b, #fbbf24); }
.metric:nth-child(4)::before { background: linear-gradient(90deg, #6366f1, #818cf8); }

.metric::after {
  content: "";
  position: absolute;
  top: -18px;
  right: -18px;
  width: 72px;
  height: 72px;
  border-radius: 50%;
  background: radial-gradient(circle, color-mix(in srgb, var(--blue) 9%, transparent) 0%, transparent 70%);
  pointer-events: none;
}

.metric span {
  color: var(--muted);
  font-size: 12.5px;
  font-weight: 600;
  letter-spacing: 0.01em;
}

.metric strong {
  display: block;
  font-size: 30px;
  font-weight: 750;
  line-height: 1.25;
  margin: 6px 0 4px;
  color: var(--ink);
  letter-spacing: -0.03em;
  font-variant-numeric: tabular-nums;
}

.metric small {
  font-size: 12px;
  color: var(--subtle);
}

.split {
  display: grid;
  grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr);
  gap: 18px;
}

.list-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 14px;
  padding: 13px 0;
  border-bottom: 1px solid #edf2f9;
}

.list-row:last-child {
  border-bottom: 0;
  padding-bottom: 2px;
}

.list-row small {
  display: block;
  margin-top: 3px;
}

.bar {
  height: 8px;
  background: #edf2fa;
  border-radius: 999px;
  overflow: hidden;
}

.bar i {
  display: block;
  height: 100%;
  background: linear-gradient(90deg, var(--blue), #38bdf8);
  border-radius: inherit;
  transition: width 0.35s cubic-bezier(0.16, 1, 0.3, 1);
}

/* ==========================================================================
   Semantic Status Badges (with Subtle Indicator Dot)
   ========================================================================== */
.badge {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  border-radius: 999px;
  background: #f1f5f9;
  border: 1px solid #e2e8f0;
  padding: 2.5px 9px;
  font-size: 12px;
  font-weight: 600;
  line-height: 1.45;
  white-space: nowrap;
  color: #475569;
}

.badge::before {
  content: "";
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: currentColor;
  opacity: 0.75;
  flex-shrink: 0;
}

.badge.green {
  color: var(--green);
  background: var(--green-bg);
  border-color: var(--green-bd);
}

.badge.blue {
  color: var(--blue);
  background: var(--tint);
  border-color: var(--brand-border);
}

.badge.amber {
  color: var(--amber);
  background: var(--amber-bg);
  border-color: var(--amber-bd);
}

.badge.red {
  color: var(--red);
  background: var(--red-bg);
  border-color: var(--red-bd);
}

/* ==========================================================================
   Filters, Inputs & Modern Form Controls
   ========================================================================== */
.filters {
  padding: 14px 18px;
  gap: 10px;
  background: #fbfcfe;
  border-bottom: 1px solid var(--line);
}

.filters > label {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  font-size: 13px;
  font-weight: 600;
  color: var(--muted);
}

.filters > .badge {
  margin-left: auto;
}

input:not([type="checkbox"]):not([type="radio"]):not([type="color"]), select, textarea {
  border: 1px solid var(--line-strong);
  border-radius: 9px;
  background: var(--surface);
  color: var(--ink);
  font-size: 13.5px;
  padding: 7px 12px;
  min-height: 38px;
  box-shadow: var(--shadow-xs);
  transition: border-color 0.16s ease, box-shadow 0.16s ease, background-color 0.16s ease;
}

input:not([type="checkbox"]):not([type="radio"]):hover, select:hover, textarea:hover {
  border-color: #b4c6de;
}

input:not([type="checkbox"]):not([type="radio"]):focus, select:focus, textarea:focus {
  outline: none;
  border-color: var(--blue);
  box-shadow: 0 0 0 3px var(--brand-ring);
  background: #ffffff;
}

input[readonly] {
  background: #f5f8fc;
  color: var(--muted);
  border-color: var(--line);
}

input[type="search"] {
  min-width: 240px;
  padding-left: 35px;

}

input[type="color"] {

textarea {

/* ==========================================================================
   Data Tables & Collapsible Customer Groups
   ========================================================================== */
.scroll {
  overflow-x: auto;
}

table {
  border-collapse: collapse;
  width: 100%;
  min-width: 560px;
  text-align: left;
  font-variant-numeric: tabular-nums;
}

th, td {
  padding: 13px 16px;
  border-bottom: 1px solid #edf2f9;
  vertical-align: middle;
}

th {
  background: #f7f9fc;
  color: #51647f;
  font-size: 12px;
  font-weight: 650;
  letter-spacing: 0.02em;
  white-space: nowrap;
  border-bottom: 1px solid var(--line);
}

tbody tr {
  transition: background-color 0.12s ease;
}

tbody tr:last-child td {
  border-bottom: 0;
}

tbody tr:hover {
  background: #f6f9ff;
}

td b {
  color: var(--ink);
  font-weight: 650;
}

td small {
  font-size: 11.5px;
  color: var(--subtle);
}

.table-foot {
  padding: 12px 18px;
  border-top: 1px solid var(--line);
  background: #fafcfe;
  color: var(--muted);
  font-size: 12.5px;
  font-weight: 500;
}

.empty {
  text-align: center;
  color: var(--muted);
  padding: 42px 24px;
  font-size: 13.5px;
}

.customer-group {
  border-bottom: 1px solid var(--line);
  transition: background-color 0.16s ease;
}

.customer-group:last-child {
  border-bottom: 0;
}

.customer-group summary {
  display: flex;
  align-items: center;
  gap: 13px;
  padding: 15px 18px;
  cursor: pointer;
  list-style: none;
  transition: background-color 0.15s ease;
}

.customer-group summary::-webkit-details-marker {
  display: none;
}

.customer-group summary::before {
  content: "";
  width: 7px;
  height: 7px;
  border-right: 2px solid #647b98;
  border-bottom: 2px solid #647b98;
  transform: rotate(-45deg);
  flex: none;
  transition: transform 0.18s ease, border-color 0.18s ease;
}

.customer-group[open] summary::before {
  transform: rotate(45deg);
  border-color: var(--blue);
}

.customer-group summary:hover {
  background: #f7faff;
}

.customer-group[open] > summary {
  background: #f3f8ff;
}

.customer-group summary b {
  font-size: 14.5px;
  color: var(--ink);
}

.customer-group summary small {
  display: block;
  margin-top: 2px;
  color: var(--muted);
}

.customer-group summary .badge {
  margin-left: auto;
}

.customer-orders {
  border-top: 1px solid var(--line);
  padding: 14px 18px 16px;
  background: #fbfdff;
}

.customer-orders .section-head {
  margin: 0 0 10px;
}

.customer-orders .section-head h2 {
  font-size: 13.5px;
  color: var(--muted);
}

.customer-orders .scroll {
  border: 1px solid var(--line);
  border-radius: 11px;
  background: #ffffff;
}

/* ==========================================================================
   Dialogs, Property Lists & Toast Notifications
   ========================================================================== */
dialog {
  width: min(580px, calc(100% - 28px));
  max-height: calc(100dvh - 32px);
  border: 1px solid var(--line);
  border-radius: var(--radius-xl);
  background: var(--surface);
  color: var(--ink);
  padding: 0;
  box-shadow: var(--shadow-dialog);
  overflow: auto;
}
dialog.wide-dialog {
  width: min(780px, calc(100% - 28px));
}

dialog::backdrop {
  background: rgba(11, 22, 44, 0.46);
  backdrop-filter: blur(5px);
  -webkit-backdrop-filter: blur(5px);
}

dialog > .section-head {
  position: sticky;
  top: 0;
  z-index: 3;
  background: rgba(255, 255, 255, 0.94);
  backdrop-filter: blur(10px);
  padding: 17px 22px;
  margin: 0;
  border-bottom: 1px solid var(--line);
}

dialog > .section-head h2 {
  font-size: 17px;
  font-weight: 700;
}

dialog > .section-head form button {
  width: 32px;
  height: 32px;
  min-height: 32px;
  padding: 0;
  border-radius: 8px;
  border-color: transparent;
  background: #f1f5f9;
  color: #475569;
  box-shadow: none;
}

dialog > .section-head form button:hover {
  background: #e2e8f0;
  color: var(--ink);
}

#dialogBody {
  padding: 20px 22px 22px;
}

.form-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 14px;
  margin: 4px 0 20px;
}

.form-grid > label {
  display: grid;
  gap: 6px;
  font-size: 13px;
  font-weight: 600;
  color: var(--ink-soft);
}

.wide {
  grid-column: 1 / -1;
}

dl {
  display: grid;
  grid-template-columns: 112px 1fr;
  gap: 10px 14px;
  margin: 4px 0 18px;
  padding: 14px 16px;
  background: var(--surface-subtle);
  border: 1px solid var(--line);
  border-radius: 12px;
}

dt {
  color: var(--muted);
  font-size: 13px;
  font-weight: 500;
}

dd {
  margin: 0;
  color: var(--ink);
  font-weight: 600;
  overflow-wrap: anywhere;
}

.toast {
  position: fixed;
  right: 24px;
  bottom: 24px;
  background: #0f1d35;
  color: #ffffff;
  padding: 11px 18px;
  border-radius: 11px;
  font-size: 13.5px;
  font-weight: 500;

}

.portal-section {

}

/* ==========================================================================
   HQ Specific Controls (Module Pill Checkboxes & Pricing Grid)
   ========================================================================== */
.hq-module-tags {
  display: flex;
  flex-wrap: wrap;
  gap: 5px;
  max-width: 360px;
}

.hq-module-tags .badge::before {

}

.hq-permissions {

.hq-permissions legend, .hq-price-fields legend {

.hq-permissions label {

  font-weight: 500;
  color: var(--ink-soft);

.hq-permissions label:hover {

}

.hq-permissions label:has(input:checked) {

.hq-permissions input {

  border-radius: 12px;
  padding: 12px 14px 14px;
}

  color: var(--ink-soft);
}

.hq-price-fields small {

  color: var(--muted);
}

.hq-price-fields input {

/* ==========================================================================
   Responsive Breakpoints
   ========================================================================== */
@media (max-width: 1024px) {
  .layout { grid-template-columns: 196px minmax(0, 1fr); }
  main, .topbar { padding-inline: 20px; }
  .split { grid-template-columns: 1fr; }
  .metrics { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .workspace-cover { padding: 24px; min-height: 164px; }
}

@media (max-width: 720px) {
  .layout { display: block; }
  .sidebar { position: static; height: auto; padding: 14px 14px 10px; }
  .brand { padding: 0 4px 12px; margin-bottom: 6px; }
  .nav { display: flex; gap: 4px; flex-wrap: wrap; padding-top: 2px; }
  .nav a, .nav button { width: auto; margin: 0; padding: 6px 10px; min-height: 34px; gap: 6px; font-size: 13px; }
  .nav a[aria-current="page"]::before, .nav button[aria-current="page"]::before { display: none; }
  .nav-label, .side-foot { display: none; }
  .topbar { padding: 8px 14px; min-height: 52px; }
  main { padding: 16px 14px 36px; }
  .workspace-cover { padding: 20px 18px; min-height: 146px; border-radius: 15px; }
  .cover-grid { inset: 0 0 0 28%; }
  .path-label, .path-sep { display: none; }
  .form-grid, .hq-price-fields { grid-template-columns: 1fr; }
}

function ensureOrderCreds(o) {
  if (!o) return { account: 'geo_demo' };
  const digits = String(o.id || '261100').replace(/\D/g, '') || '261100';
  if (!o.loginAccount) o.loginAccount = 'geo_' + digits;
  if ('loginPass' in o) delete o.loginPass;
  return { account: o.loginAccount };
}
function getCustPwdState(o) {
  const creds = ensureOrderCreds(o);
  const map = load(CUST_PWD_KEY, {});
  if (o && map[o.id]) return { account: creds.account, ...map[o.id] };
  const seeded = o && SEEDED_APPLIED_PWD_ORDERS.has(o.id);
  return {
    account: creds.account,
    applied: Boolean(seeded),
    appliedAt: seeded ? (o.start + ' 10:30') : '',
    appliedBy: seeded ? (o.sales || '跟单销售') : '',
    resetCount: 0,
    lastResetAt: ''
  };
}
function normalizeOrders(orders) {
  orders.forEach(o => {
    if (orderVersion(o.package) === '工具版') {
      o.owner = '';
      if (o.service === '待派单' || o.service === '待启动') o.service = '使用中';
    }
    ensureOrderCreds(o);
  });
}

function customerFilterActive() {
  return Boolean(customerFilters.search.trim() || customerFilters.service!=='全部服务状态' || customerFilters.seller!=='全部销售' || customerFilters.version!=='全部订单版本' || customerFilters.rank!=='全部榜单' || customerFilters.quick!=='all');
}
function filterCustomers() {
  const term = customerFilters.search.trim().toLowerCase();
  const groups = Map.groupBy(data.orders,order=>order.customer);
  const cards = [];
  let matches = 0;
  for (const [name,all] of groups) {
    const visible = all.filter(o=>[o.customer,o.industry,o.id,o.note].some(v=>v.toLowerCase().includes(term)) &&
      (customerFilters.service==='全部服务状态'||o.service===customerFilters.service) &&
      (customerFilters.seller==='全部销售'||o.sales===customerFilters.seller) &&
      (customerFilters.version==='全部订单版本'||orderVersion(o.package)===customerFilters.version) &&
      (customerFilters.rank==='全部榜单'||o.rank===customerFilters.rank) &&
      (customerFilters.quick==='all' ||
        (customerFilters.quick==='unassigned' && isServiceOrder(o) && !o.owner) ||
        (customerFilters.quick==='dropped' && o.rank==='掉榜') ||
        (customerFilters.quick==='renew' && o.renewal!=='已续费')));
    if (!visible.length) continue;
    matches += visible.length;
    const sales = [...new Set(all.map(o=>o.sales))].join('、');
    const orderCount = visible.length===all.length ? all.length+' 笔订单' : '显示 '+visible.length+' / '+all.length+' 笔订单';
    cards.push(`<details class="customer-group" data-customer="${esc(name)}" ${customerFilterActive()||expandedCustomers.has(name)?'open':''}>
      <summary><span><b>${esc(name)}</b><small>${esc(all[0].industry)} · 跟单销售 ${esc(sales)}</small></span>
        ${badge(orderCount,'blue')}</summary>
      <div class="customer-orders">
        <div class="section-head"><h2>客户订单</h2>${btn('add-order','＋ 为该客户新增订单',name)}</div>
        ${orderTable(visible,true)}
      </div></details>`);
  }
  $('#customerResults').innerHTML = (cards.join('') || '<div class="empty">没有符合条件的客户或订单</div>')+
    `<div class="table-foot">共 ${cards.length} 个客户 · ${matches} 笔订单</div>`;
}

function getDomainCfg(tid = tenantId) {
  const map = load(DOMAIN_CFG_KEY, DEFAULT_DOMAIN_CFGS);
  if (map[tid]) return map[tid];
  return { domain: '', status: '未配置', httpsEnabled: false, cnameTarget: `oem-${tid.toLowerCase()}.geo-cloud-edge.cn`, updatedAt: '', note: '' };

function saveDomainCfg(tid, patch) {
  const map = load(DOMAIN_CFG_KEY, DEFAULT_DOMAIN_CFGS);
  map[tid] = { ...getDomainCfg(tid), ...patch };
  save(DOMAIN_CFG_KEY, map);
  return map[tid];
}

  try {

    if (p && p.prices) {

function getSkuDefaultQuota(ver) {
  const base = DEFAULT_VER_DEFS[tenantId] || DEFAULT_VER_DEFS['OEM-001'];
  return ver === '工具版' ? { ...base.tool } : { ...base.service };
}

function ensureOrderQuota(o) {
  const isTool = orderVersion(o.package) === '工具版';
  const ver = isTool ? '工具版' : '服务版';
  const sku = getSkuDefaultQuota(ver);
  const vd = accGetVerDefaults(tenantId)[isTool ? 'tool' : 'service'];
  const def = defaultOrderAccounting[o.id] || {
    articles: { used: 0, limit: Math.min(vd.articles, sku.articles) },
    crawl: { used: 0, limit: Math.min(vd.crawlLimit, sku.crawlLimit) },
    sourceSpend: 0, sourceLimit: Math.min(vd.sourceLimit, sku.sourceLimit)
  };
  if (!o.quotas || !o.quotas.crawl || typeof o.quotas.crawl.used !== 'number') {
    const prevArt = o.quotas?.articles || def.articles;
    const prevSrc = typeof o.quotas?.sourceSpend === 'number' ? o.quotas.sourceSpend : def.sourceSpend;
    const prevSrcLim = typeof o.quotas?.sourceLimit === 'number' ? o.quotas.sourceLimit : def.sourceLimit;
    o.quotas = {
      articles: structuredClone(prevArt),
      crawl: structuredClone(def.crawl),
      sourceSpend: prevSrc,
      sourceLimit: prevSrcLim
    };
  }
  if (!o.quotas.paidBase) {
    o.quotas.paidBase = {
      articles: Math.max(sku.articles, Number(o.quotas.articles.limit || 0)),
      crawl: Math.max(sku.crawlLimit, Number(o.quotas.crawl.limit || 0)),
      source: Math.max(sku.sourceLimit, Number(o.quotas.sourceLimit || 0))
    };
  }
  if (!Array.isArray(o.modules)) o.modules = [...partnerClientModules];
  return o.quotas;
}

function calcQuotaExpandCost(o, nextArt, nextCrawl, nextSrc) {
  const q = ensureOrderQuota(o);
  const ver = orderVersion(o.package);
  const sku = getSkuDefaultQuota(ver);
  const rates = accGetHqRates(tenantId);
  const baseArt = Math.max(sku.articles, Number(q.paidBase?.articles || 0));
  const baseCrawl = Math.max(sku.crawlLimit, Number(q.paidBase?.crawl || 0));
  const baseSrc = Math.max(sku.sourceLimit, Number(q.paidBase?.source || 0));
  const extraArt = Math.max(0, nextArt - baseArt);
  const extraCrawl = Math.max(0, nextCrawl - baseCrawl);
  const extraSrc = Math.max(0, nextSrc - baseSrc);
  const artCost = Number((extraArt * rates.articles).toFixed(2));
  const crawlCost = Number((extraCrawl * rates.crawl).toFixed(2));
  const srcCost = Number(extraSrc.toFixed(2));
  const total = Number((artCost + crawlCost + srcCost).toFixed(2));
  const items = [];
  if (extraArt > 0) items.push({ label: '生文额度扩容', prev: `${q.articles.limit} 篇`, base: `${baseArt} 篇`, next: `${nextArt} 篇`, delta: `+${extraArt} 篇`, unit: `¥${rates.articles.toFixed(2)}/篇`, cost: artCost });
  if (extraCrawl > 0) items.push({ label: '爬虫额度扩容', prev: `${q.crawl.limit} 次`, base: `${baseCrawl} 次`, next: `${nextCrawl} 次`, delta: `+${extraCrawl} 次`, unit: `¥${rates.crawl.toFixed(2)}/次`, cost: crawlCost });
  if (extraSrc > 0) items.push({ label: '信源额度增配', prev: `¥${Number(q.sourceLimit || 0).toLocaleString('zh-CN')}`, base: `¥${baseSrc.toLocaleString('zh-CN')}`, next: `¥${nextSrc.toLocaleString('zh-CN')}`, delta: `+¥${extraSrc.toLocaleString('zh-CN')}`, unit: '等额增配', cost: srcCost });
  return { ver, sku, rates, baseArt, baseCrawl, baseSrc, extraArt, extraCrawl, extraSrc, artCost, crawlCost, srcCost, total, items };
}

function calcOrderCost(o) {
  const q = ensureOrderQuota(o);
  const r = accGetHqRates(tenantId);
  const articleCost = q.articles.used * r.articles;
  const crawlSpend = q.crawl.used * r.crawl;
  const usedCost = articleCost + crawlSpend + q.sourceSpend;
  return {articleCost, crawlSpend, sourceSpend: q.sourceSpend, usedCost};
}

function quotaMiniBar(q, unit) {
  if (!q.limit) return `<small class="muted">未分配 (0 ${unit})</small>`;
  const pct = Math.min(100, Math.round(q.used / q.limit * 100));
  const warn = pct >= 85;
  return `<div style="min-width:124px">
    <div style="display:flex;justify-content:space-between;font-size:11.5px;margin-bottom:3px">
      <b style="${warn?'color:var(--red)':''}">${q.used.toLocaleString()} / ${q.limit.toLocaleString()} ${unit}</b>
      <small>${pct}%</small>
    </div>
    <div class="bar"><i style="width:${pct}%;${warn?'background:var(--red)':''}"></i></div>
  </div>`;
}

function accLoad(key, def) {
  try {
    const raw = localStorage.getItem(key);
    return raw ? JSON.parse(raw) : structuredClone(def);
  } catch { return structuredClone(def); }
}
function accSave(key, val) {
  try { localStorage.setItem(key, JSON.stringify(val)); } catch {}
}
function accNow() {
  const d = new Date(), p = n => String(n).padStart(2,'0');
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
}
function accGetBalance(tid='OEM-001') {
  const map = accLoad(ACC_KEYS.balances, DEFAULT_BALANCES);
  return Number(map[tid] ?? 0);
}
function accRecharge(tid, amount, note, type='CRM 充值入账') {
  const map = accLoad(ACC_KEYS.balances, DEFAULT_BALANCES);
  const next = Number(((map[tid] ?? 0) + Number(amount)).toFixed(2));
  map[tid] = next;
  accSave(ACC_KEYS.balances, map);
  const recs = accLoad(ACC_KEYS.records, DEFAULT_RECORDS);
  recs.unshift({
    id: 'LS-' + (1010 + recs.length),
    time: accNow(), partner: tid, type,
    desc: note || 'CRM 签约订单充值入账',
    amount: Number(Number(amount).toFixed(2)),
    after: next
  });
  accSave(ACC_KEYS.records, recs);
  return next;
}
function accDeduct(tid, type, desc, cost) {
  const bal = accGetBalance(tid);
  if (bal < cost) {
    return { ok: false, balance: bal, msg: `账户余额不足（当前余额 ¥${bal.toFixed(2)}，本次需扣 ¥${Number(cost).toFixed(2)}），请联系商务通过 CRM 充值入账。` };
  }
  const map = accLoad(ACC_KEYS.balances, DEFAULT_BALANCES);
  const next = Number((bal - Number(cost)).toFixed(2));
  map[tid] = next;
  accSave(ACC_KEYS.balances, map);
  const recs = accLoad(ACC_KEYS.records, DEFAULT_RECORDS);
  recs.unshift({
    id: 'LS-' + (1009 + recs.length),
    time: accNow(), partner: tid, type, desc,
    amount: -Number(Number(cost).toFixed(2)),
    after: next
  });
  accSave(ACC_KEYS.records, recs);
  return { ok: true, balance: next };
}
function accGetMediaCfg(tid='OEM-001') {
  const map = accLoad(ACC_KEYS.mediaCfg, DEFAULT_MEDIA_CFG);
  return map[tid] || { markup: 1.0, hideServicePrice: true };
}

function accGetVerDefaults(tid='OEM-001') {
  const map = accLoad(ACC_KEYS.verDefs, DEFAULT_VER_DEFS);

function accSaveVerDefaults(tid, obj) {
  const map = accLoad(ACC_KEYS.verDefs, DEFAULT_VER_DEFS);

function accGetSellerLim(tid='OEM-001') {

function accGetSellerQuota(tid, name) {
  const sd = accGetVerDefaults(tid).salesDefaults;

}

function walletOrdersPanel(vd, rates) {
  const term = walletOrderTerm.trim().toLowerCase();
  const list = data.orders.filter(o => {
    const ver = orderVersion(o.package);
    return (walletOrderVer === '全部版本' || ver === walletOrderVer) &&
      (!term || o.customer.toLowerCase().includes(term) || o.id.toLowerCase().includes(term) || o.sales.toLowerCase().includes(term));
  });
  return `<section class="panel">
    <div class="filters">
      <input type="search" id="walletOrderSearch" value="${esc(walletOrderTerm)}" placeholder="搜索客户、订单号或跟单销售" aria-label="搜索订单">
      <select id="walletOrderVerSel" aria-label="筛选版本">${options(['全部版本','服务版','工具版'], walletOrderVer)}</select>
    </div>
    <div id="walletOrdersBody">${walletOrdersTable(list, vd, rates)}</div>
  </section>`;
}

function walletOrdersTable(list, vd, rates) {
  return table(
    ['客户 / 单号','版本','优化师','开单基础费','生文（已用/上限）','爬虫（已用/上限）','信源花费 / 账户余额','额外服务费','操作'],
    list.map(o => {
      const q = ensureOrderQuota(o);
      const ver = orderVersion(o.package);
      const isTool = ver === '工具版';
      const defV = vd[isTool ? 'tool' : 'service'];
      const cLim = typeof q.crawl.limit === 'number' ? q.crawl.limit : defV.crawlLimit;
      const sLim = typeof q.sourceLimit === 'number' ? q.sourceLimit : defV.sourceLimit;
      const baseFee = typeof o.baseFee === 'number' ? o.baseFee : (isTool ? 1500 : 4500);
      const tw = isTool ? getToolWallet(o.id, o) : null;
      const effSourceSpend = isTool ? tw.spent : q.sourceSpend;
      const crawlFee = q.crawl.used * rates.crawl;
      const totExtra = q.articles.used * rates.articles + crawlFee + effSourceSpend;
      const sourceCell = isTool
        ? `<span class="tool-wallet-chip ${tw.balance<=0?'empty':(tw.balance<300?'low':'')}">余 ¥${tw.balance.toLocaleString('zh-CN')}</span><br><small class="muted">已耗 ¥${tw.spent.toLocaleString('zh-CN')} / 划拨 ¥${tw.allocated.toLocaleString('zh-CN')}</small>`
        : `<b>¥${q.sourceSpend.toLocaleString('zh-CN')}</b> <small class="muted">/ ${sLim ? '¥'+sLim.toLocaleString('zh-CN') : '不限'}</small>`;
      return [
        `<b>${esc(o.customer)}</b><br><small style="white-space:nowrap">${esc(o.id)} · ${esc(o.sales)}</small>`,
        badge(ver, isTool?'green':'blue'),
        ownerAssignControl(o),
        `<b>¥${baseFee.toLocaleString('zh-CN')}</b><br><small class="muted">${o.months||3}个月</small>`,
        `<b>${q.articles.used} / ${q.articles.limit} 篇</b>`,
        `<b>${q.crawl.used} / ${cLim ? cLim + ' 次' : '不限'}</b><br><small class="muted">¥${crawlFee.toFixed(2)}</small>`,
        sourceCell,
        `<b style="color:var(--blue)">¥${totExtra.toFixed(2)}</b>`,
        `<div class="cell-actions">${isTool ? `<button class="link-button alloc-btn" data-alloc-tool="${esc(o.id)}">划拨花费</button>` : ''}<button class="link-button" data-quota-edit="${esc(o.id)}">调额度</button>${preview(o,true)}</div>`
      ];
    })
  ) + foot(list.length);
}

document.addEventListener('click', e => {
  const wt = e.target.closest('[data-wallet-tab]');
  if (wt) {
    walletTab = wt.dataset.walletTab;
    render();
    return;
  }
  const lf = e.target.closest('[data-ledger-filter]');
  if (lf) {
    ledgerFilter = lf.dataset.ledgerFilter;
    render();
    return;
  }
  const act = e.target.closest('[data-p-act]')?.dataset.pAct;
  if (act === 'open-rates') {
    openRateRulesModal();
    return;
  }
  if (act === 'open-records') {
    walletTab = 'ledger';
    if (location.hash === '#quotas') render();
    else location.hash = 'quotas';
  }
  if (act === 'apply-ver-defaults') {
    const form = $('#verDefaultsForm');
    if (form) {
      const fd = new FormData(form);
      const vd = accGetVerDefaults(tenantId);
      const skuSvc = getSkuDefaultQuota('服务版');
      const skuTool = getSkuDefaultQuota('工具版');
      vd.service = {
        articles: Math.min(skuSvc.articles, Math.max(1, Number(fd.get('svc_art')))),
        crawlLimit: Math.min(skuSvc.crawlLimit, Math.max(10, Number(fd.get('svc_crawl')))),
        sourceLimit: Math.min(skuSvc.sourceLimit, Math.max(100, Number(fd.get('svc_source'))))
      };
      vd.tool = {
        articles: Math.min(skuTool.articles, Math.max(1, Number(fd.get('tool_art')))),
        crawlLimit: Math.min(skuTool.crawlLimit, Math.max(10, Number(fd.get('tool_crawl')))),
        sourceLimit: Math.min(skuTool.sourceLimit, Math.max(100, Number(fd.get('tool_source'))))
      };
      accSaveVerDefaults(tenantId, vd);
      data.orders.forEach(o => {
        const q = ensureOrderQuota(o);
        const t = vd[orderVersion(o.package) === '工具版' ? 'tool' : 'service'];
        q.articles.limit = Math.max(q.articles.used, t.articles);
        q.crawl.limit = Math.max(q.crawl.used, t.crawlLimit);
        q.sourceLimit = Math.max(Math.ceil(Number(q.sourceSpend || 0)), t.sourceLimit);
      });
      save(storageKey, data);
      render();
      toast('已保存默认额度（不超过默认 SKU 上限），并同步套用到现有订单');
    }
  }
  if (act === 'apply-sales-default') {
    const form = $('#salesDefaultForm');
    if (form) {
      const fd = new FormData(form);
      const sd = {
        keywords: Number(fd.get('def_keywords') || 50),
        baseline: Number(fd.get('def_baseline') || 20),
        diagnosis: Number(fd.get('def_diagnosis') || 15)
      };
      const vd = accGetVerDefaults(tenantId);
      vd.salesDefaults = sd;
      accSaveVerDefaults(tenantId, vd);
      people('销售').forEach(p => {
        const cur = accGetSellerQuota(tenantId, p.name);
        cur.keywords.limit = Math.max(cur.keywords.used, sd.keywords);
        cur.baseline.limit = Math.max(cur.baseline.used, sd.baseline);
        cur.diagnosis.limit = Math.max(cur.diagnosis.used, sd.diagnosis);
        accSaveSellerLim(tenantId, p.name, cur);
      });
      render();
      toast(`已将全部销售的月度默认上限统一更新（选词 ${sd.keywords} / 基线 ${sd.baseline} / 报告 ${sd.diagnosis}）`);
    }
  }
  const rstBtn = e.target.closest('[data-reset-ver-default]');
  if (rstBtn) {
    const o = data.orders.find(x => x.id === rstBtn.dataset.resetVerDefault);
    const f = $('#quotaEditForm');
    if (o && f) {
      const q = ensureOrderQuota(o);
      const sku = getSkuDefaultQuota(orderVersion(o.package));
      f.elements.lim_articles.value = Math.max(q.articles.used, sku.articles);
      f.elements.lim_crawl.value = Math.max(q.crawl.used, sku.crawlLimit);
      f.elements.lim_source.value = Math.max(Math.ceil(Number(q.sourceSpend || 0)), sku.sourceLimit);
      updateOrderQuotaPreview();
      toast('已恢复该版本默认 SKU 额度（无需额外扣费）');
    }
  }
  const sl = e.target.closest('[data-p-sellerlim]');
  if (sl) {
    const nm = sl.dataset.pSellerlim;
    const cur = accGetSellerQuota(tenantId, nm);
    modal('调整本月额度 · ' + nm, `
      <form id="simpleSellerLimForm" data-name="${esc(nm)}">
        <div class="hq-price-fields" style="grid-template-columns:repeat(3,minmax(0,1fr));margin-bottom:14px">
          <label>选词工具（次）<small>已用 ${cur.keywords.used}</small>
            <input type="number" name="lim_keywords" min="${cur.keywords.used}" max="5000" value="${cur.keywords.limit}" required>
          </label>
          <label>基线测算（次）<small>已用 ${cur.baseline.used}</small>
            <input type="number" name="lim_baseline" min="${cur.baseline.used}" max="2000" value="${cur.baseline.limit}" required>
          </label>
          <label>售前报告（份）<small>已用 ${cur.diagnosis.used}</small>
            <input type="number" name="lim_diagnosis" min="${cur.diagnosis.used}" max="1000" value="${cur.diagnosis.limit}" required>
          </label>
        </div>
        <button type="submit" class="primary">保存</button>
      </form>`);
  }
});

  const list = data.orders.filter(o => {

      (!term || o.customer.toLowerCase().includes(term) || o.id.toLowerCase().includes(term) || o.sales.toLowerCase().includes(term));

      period: `${o.start} 至 ${o.end}`
    })),
    ...(byOrder.has('PRE-SALES') ? [{ orderId: 'PRE-SALES', customer: '售前商机调用', version: '售前公共', sales: '全部销售', period: '售前阶段' }] : [])
  ].map(item => {
    const list = byOrder.get(item.orderId) || [];
    const total = list.reduce((s, x) => s + Number(x.cost || 0), 0);
    const times = list.map(x => x.callTime || x.time || '').filter(Boolean).sort();
    return {
      ...item,
      count: list.length,
      total,
      exportable: list.length > 0,
      range: times.length ? `${times[0].slice(0, 10)} ~ ${times[times.length - 1].slice(0, 10)}` : '—'
    };
  }).filter(item =>
    (apiExportFilter.version === '全部版本' || item.version === apiExportFilter.version) &&
    (!apiExportFilter.onlyExportable || item.exportable)
  );
  const exportableIds = candidates.filter(c => c.exportable).map(c => c.orderId);
  const checkedValid = exportableIds.filter(id => apiExportChecked.has(id));
  const allChecked = exportableIds.length > 0 && checkedValid.length === exportableIds.length;
  const hist = loadApiExportHist();
  return `
    <section class="panel" style="margin-bottom:16px">
      <div class="pad">
        ${section('支持导出明细的订单列表',
          `<div class="actions">
            <button type="button" class="primary" data-api-act="batch-export" ${checkedValid.length ? '' : 'disabled'}>批量导出已选订单（${checkedValid.length} 单）</button>
          </div>`
        )}
      </div>
      <div class="filters" style="padding-top:0">
        <select id="apiExpVer" aria-label="筛选订单版本">${options(['全部版本','服务版','工具版','售前公共'], apiExportFilter.version)}</select>

          <span>计费时段</span>
          <input type="date" id="apiExpStart" value="${esc(apiExportFilter.startDate)}" aria-label="开始日期">
          <span>至</span>
          <input type="date" id="apiExpEnd" value="${esc(apiExportFilter.endDate)}" aria-label="结束日期">
        </label>
        <label style="display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;color:var(--ink-soft);cursor:pointer">
          <input type="checkbox" id="apiExpCheckAll" ${allChecked ? 'checked' : ''} ${exportableIds.length ? '' : 'disabled'} style="min-height:auto;accent-color:var(--blue)"> 全选可导出订单
        </label>
        <label style="display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;color:var(--ink-soft);cursor:pointer">
          <input type="checkbox" id="apiExpOnly" ${apiExportFilter.onlyExportable ? 'checked' : ''} style="min-height:auto;accent-color:var(--blue)"> 仅看可导出订单
        </label>
        <button type="button" data-api-act="reset-exp-filter">重置</button>
      </div>
      ${table(
        ['勾选', '订单编号 / 客户企业', '版本', '导出状态', 'API 扣费时段', '明细条数 / 合计扣费', '操作'],
        candidates.map(c => {
          const vTone = c.version === '工具版' ? 'green' : (c.version === '服务版' ? 'blue' : 'amber');
          return [
            `<input type="checkbox" data-api-exp-chk="${esc(c.orderId)}" ${apiExportChecked.has(c.orderId) ? 'checked' : ''} ${c.exportable ? '' : 'disabled'} style="min-height:auto;accent-color:var(--blue)" aria-label="勾选 ${esc(c.orderId)}">`,
            c.orderId === 'PRE-SALES'
              ? `<b>无绑定订单</b><br><small class="muted">${esc(c.customer)}</small>`
              : `<b>${esc(c.orderId)}</b><br><small>${esc(c.customer)} · ${esc(c.sales)}</small>`,
            badge(c.version, vTone),
            c.exportable ? badge('支持导出明细', 'green') : badge('暂无扣费明细', ''),
            `<small style="white-space:nowrap">${esc(c.range)}</small>`,
            c.exportable ? `<b>${c.count} 条</b><br><small style="color:var(--blue);font-weight:650">¥${c.total.toFixed(2)}</small>` : '<span class="muted">0 条 · ¥0.00</span>',
            c.exportable
              ? `<div class="cell-actions"><button type="button" class="link-button" data-api-dl-order="${esc(c.orderId)}">下载明细 CSV</button><button type="button" class="link-button" data-api-filter-order="${esc(c.orderId)}">查看明细</button></div>`
              : `<span class="muted" style="font-size:12px">暂无可导出</span>`
          ];
        })
      )}
      <div class="table-foot">共 ${candidates.length} 笔订单，其中 <b style="color:var(--green)">${exportableIds.length} 笔</b> 支持导出 API 扣费明细（含精确请求时间、扣费结算时间与逐笔实扣金额）</div>
    </section>

    <section class="panel">
      <div class="pad">${section('最近导出下载记录', badge(`共 ${hist.length} 条`, ''))}</div>
      ${table(
        ['导出编号', '导出时间', '导出范围', '明细条数', '合计金额', '文件名', '操作'],
        hist.slice(0, 8).map(h => [
          `<small style="font-family:ui-monospace,monospace">${esc(h.id)}</small>`,
          `<small style="white-space:nowrap">${esc(h.time)}</small>`,
          `<b>${esc(h.scope)}</b>`,
          `${h.count} 条`,
          `<b style="color:var(--blue)">¥${Number(h.amount).toFixed(2)}</b>`,
          `<small class="api-path-code">${esc(h.file)}</small>`,
          `<button type="button" class="link-button" data-api-redl="${esc(h.id)}">重新下载</button>`
        ])
      )}
    </section>`;
}

function renderApiLogsTable(logs) {
  const filtered = filterApiLogs(logs);
  const sumCost = filtered.reduce((s, l) => s + Number(l.cost || 0), 0);
  return table(
    ['Request ID', '归属订单 / 客户', '核心能力接口', '请求时间 / 扣费结算时间', '计费方式 / 耗时', '实扣金额', '扣费后余额'],
    filtered.slice(0, 30).map(l => {
      const oid = l.orderId || 'PRE-SALES';
      const vTone = l.version === '工具版' ? 'green' : (l.version === '服务版' ? 'blue' : 'amber');
      return [
        `<small style="font-family:ui-monospace,monospace">${esc(l.id)}</small><br>${badge(String(l.status || 200) + ' OK', 'green')}`,
        oid === 'PRE-SALES'
          ? `<b>无订单</b> ${badge('售前公共', 'amber')}<br><small class="muted">${esc(l.customer || '售前商机调用')}</small>`
          : `<b>${esc(oid)}</b> ${badge(l.version || '服务版', vTone)}<br><small>${esc(l.customer || '—')}</small>`,
        `<b>${esc(l.mod)}</b><br><small class="api-path-code">${esc(l.path)}</small>`,
        `<small style="white-space:nowrap">请求 ${esc(l.callTime || l.time || '—')}<br><span class="muted">扣费 ${esc(l.billTime || l.callTime || l.time || '—')}</span></small>`,
        `${badge(l.billingMode || '按调用次数', l.billingMode === '按媒体标价' ? 'amber' : 'blue')}<br><small class="muted">${esc(l.qty || '1 次')} · ${l.ms} ms</small>`,
        `<b style="color:var(--red);white-space:nowrap">-¥${Number(l.cost).toFixed(2)}</b>`,
        `<span style="white-space:nowrap">¥${Number(l.after).toLocaleString('zh-CN', { minimumFractionDigits: 2 })}</span>`
      ];
    })
  ) + `<div class="table-foot">共 ${filtered.length} 条 API 扣费明细 · 当前筛选合计扣费 <b style="color:var(--red)">¥${sumCost.toFixed(2)}</b></div>`;
}

const pages = {customers,quotas:simpleWalletPage,sales:simpleSalesPage,optimizers:()=>staff('优化师'),brand:brandPage,api:apiPage};
function currentView() {
  if (portalRole) return {page:portalPage,account:portalAccount};
  let [id,query] = location.hash.slice(1).split('?');
  if (id==='orders' || id==='overview' || id==='renewals') { id='customers'; history.replaceState(null,'','#customers'); }
  if (id==='operations') { id='customers'; customerFilters.quick='dropped'; history.replaceState(null,'','#customers'); }
  const page = Object.hasOwn(pages,id) ? id : 'customers';
  const account = ['sales','optimizers'].includes(page) ? new URLSearchParams(query).get('account') : null;
  return {page,account};
}

function calcEndDate(startStr, months) {

  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}`;
}

function handleBrandIconFile(file) {
  if (!file) return;
  if (file.size > 2 * 1024 * 1024) {
    toast('图标文件不能超过 2MB，请选择较小的 PNG / SVG / JPG 图片');
    return;
  }
  const reader = new FileReader();
  reader.onload = () => {
    const rawUrl = String(reader.result || '');
    if (!rawUrl) return;
    if (file.type === 'image/svg+xml' || rawUrl.startsWith('data:image/svg+xml')) {
      applyBrandIconDataUrl(rawUrl, file.name);
      return;
    }
    const img = new Image();
    img.onload = () => {
      const size = 128;
      const canvas = document.createElement('canvas');
      canvas.width = size;
      canvas.height = size;
      const ctx = canvas.getContext('2d');
      const minSide = Math.min(img.width, img.height);
      const sx = (img.width - minSide) / 2;
      const sy = (img.height - minSide) / 2;
      ctx.clearRect(0, 0, size, size);
      ctx.drawImage(img, sx, sy, minSide, minSide, 0, 0, size, size);
      try {
        applyBrandIconDataUrl(canvas.toDataURL('image/png'), file.name);
      } catch {
        applyBrandIconDataUrl(rawUrl, file.name);
      }
    };
    img.onerror = () => applyBrandIconDataUrl(rawUrl, file.name);
    img.src = rawUrl;
  };
  reader.readAsDataURL(file);
}

  const presetBtn = event.target.closest('[data-brand-icon-preset]');
  if (presetBtn) {
    const ic = PRESET_BRAND_ICONS[Number(presetBtn.dataset.brandIconPreset)];
    if (ic) applyBrandIconDataUrl(ic.dataUrl, ic.name);
    return;
  }
  const verBtn = event.target.closest('[data-edit-cver]');
  if (verBtn) {
    editingClientVer = verBtn.dataset.editCver;
    const c = ensureDualPortalConfigs()[editingClientVer];
    document.documentElement.style.setProperty('--tenant-color', c.color);
    document.documentElement.style.setProperty('--blue', c.color);
    render();
    return;
  }
  const chip = event.target.closest('[data-pick-color]');
  if (chip) {
    const input = $('#brandColorInput');
    if (input) {
      input.value = chip.dataset.pickColor;
      syncLiveDualBrand();
    }
    return;
  }
  const qBtn = event.target.closest('[data-quota-edit]');
  if (qBtn) {
    const o = data.orders.find(x => x.id === qBtn.dataset.quotaEdit);
    if (o) openOrderQuotaModal(o);
    return;
  }
  const qBackBtn = event.target.closest('[data-quota-back-edit]');
  if (qBackBtn) {
    const o = data.orders.find(x => x.id === qBackBtn.dataset.quotaBackEdit);
    if (o) {
      const draft = pendingQuotaCharge && pendingQuotaCharge.orderId === o.id
        ? { lim_articles: pendingQuotaCharge.nextArt, lim_crawl: pendingQuotaCharge.nextCrawl, lim_source: pendingQuotaCharge.nextSrc }
        : null;
      openOrderQuotaModal(o, draft);
    }
    return;
  }
  if (event.target.closest('#confirmQuotaChargeBtn')) {
    if (!pendingQuotaCharge) return;
    const { orderId, nextArt, nextCrawl, nextSrc } = pendingQuotaCharge;
    const o = data.orders.find(x => x.id === orderId);
    if (!o) { pendingQuotaCharge = null; return; }
    const calc = calcQuotaExpandCost(o, nextArt, nextCrawl, nextSrc);
    const summaryParts = calc.items.map(it => `${it.label}${it.delta}（¥${it.cost.toFixed(2)}）`).join(' + ');
    const pay = accDeduct(tenantId, '订单调额扩容', `订单「${o.customer} · ${o.id}」超默认 SKU 向上调额：${summaryParts}`, calc.total);
    if (!pay.ok) { toast(pay.msg); return; }
    const q = ensureOrderQuota(o);
    q.articles.limit = nextArt;
    q.crawl.limit = nextCrawl;
    q.sourceLimit = nextSrc;
    q.paidBase = {
      articles: Math.max(calc.baseArt, nextArt),
      crawl: Math.max(calc.baseCrawl, nextCrawl),
      source: Math.max(calc.baseSrc, nextSrc)
    };
    appendOrderQuotaLog(o.id, `代理商付费向上调额（扣代理商余额 ¥${calc.total.toFixed(2)}）：生文上限 ${nextArt} 篇、爬虫上限 ${nextCrawl} 次、信源上限 ¥${nextSrc.toLocaleString('zh-CN')}`);
    pendingQuotaCharge = null;
    save(storageKey, data);
    $('#dialog').close();
    render();
    toast(`扣费成功！已扣除代理商余额 ¥${calc.total.toLocaleString('zh-CN', { minimumFractionDigits: 2 })}，当前余额 ¥${pay.balance.toLocaleString('zh-CN', { minimumFractionDigits: 2 })}`);
    return;
  }
  const qfBtn = event.target.closest('[data-quick-cust-filter]');
  if (qfBtn) {
    Object.assign(customerFilters, customerFilterDefaults, { quick: qfBtn.dataset.quickCustFilter });
    if (location.hash !== '#customers') location.hash = 'customers';
    else render();
    return;
  }
  const rnBtn = event.target.closest('[data-renew-order]');
  if (rnBtn) {
    const o = data.orders.find(x => x.id === rnBtn.dataset.renewOrder);
    if (o) openRenewModal(o);
    return;
  }
  const allocBtn = event.target.closest('[data-alloc-tool]');
  if (allocBtn) {
    const o = data.orders.find(x => x.id === allocBtn.dataset.allocTool);
    if (o) openToolAllocModal(o);
    return;
  }
  const pickAlloc = event.target.closest('[data-pick-alloc]');
  if (pickAlloc) {
    const inp = document.getElementById(pickAlloc.dataset.target);
    if (inp) {
      inp.value = pickAlloc.dataset.pickAlloc;
      if (pickAlloc.dataset.target === 'newOrderToolAlloc') updateNewOrderFeeUI();
    }
    return;
  }
  const cpBtn = event.target.closest('[data-copy-creds]');
  if (cpBtn) {
    const o = data.orders.find(x => x.id === cpBtn.dataset.copyCreds);
    if (o) {
      const c = ensureOrderCreds(o);
      const txt = `客户：${o.customer}\n版本：${orderVersion(o.package)}\n登录账号：${c.account}\n密码说明：初始密码请由跟单销售（${o.sales}）在销售后台申请/重置（仅展示一次）`;
      navigator.clipboard?.writeText(txt).catch(()=>{});
      toast(`已复制客户登录账号 ${c.account}（密码请由销售后台申请/重置）`);
    }
    return;
  }
});
document.addEventListener('input', event => {
  if (event.target.id === 'brandIconFile') return;
  if (event.target.id === 'apiFilterTerm') {
    apiLogFilter.term = event.target.value;
    const box = $('#apiLogsTableBox');
    if (box) box.innerHTML = renderApiLogsTable(getApiCfg(tenantId).logs);
    return;
  }
  if (event.target.closest('#brandForm')) syncLiveDualBrand();
});
document.addEventListener('change', event => {
  if (event.target.id === 'brandIconFile') {
    handleBrandIconFile(event.target.files?.[0]);
    event.target.value = '';
    return;
  }
  if (event.target.id === 'apiTestOrderSel') {
    apiTestOrderId = event.target.value;
    return;
  }
  if (event.target.id === 'apiFilterOrder') {
    apiLogFilter.orderId = event.target.value;
    const box = $('#apiLogsTableBox');
    if (box) box.innerHTML = renderApiLogsTable(getApiCfg(tenantId).logs);
    return;
  }
  if (event.target.id === 'apiCatalogGroupSel') {
    apiCatalogGroup = event.target.value;
    render();
    return;
  }
  if (event.target.id === 'apiFilterMod') {
    apiLogFilter.modKey = event.target.value;
    const box = $('#apiLogsTableBox');
    if (box) box.innerHTML = renderApiLogsTable(getApiCfg(tenantId).logs);
    return;
  }
  if (event.target.id === 'apiFilterStart' || event.target.id === 'apiFilterEnd') {
    apiLogFilter[event.target.id === 'apiFilterStart' ? 'startDate' : 'endDate'] = event.target.value;
    render();
    return;
  }
  if (event.target.id === 'apiExpVer') {
    apiExportFilter.version = event.target.value;
    render();
    return;
  }
  if (event.target.id === 'apiExpOnly') {
    apiExportFilter.onlyExportable = event.target.checked;
    render();
    return;
  }
  if (event.target.id === 'apiExpStart' || event.target.id === 'apiExpEnd') {
    apiExportFilter[event.target.id === 'apiExpStart' ? 'startDate' : 'endDate'] = event.target.value;
    render();
    return;
  }
  if (event.target.id === 'apiExpCheckAll') {
    const on = event.target.checked;
    document.querySelectorAll('[data-api-exp-chk]:not(:disabled)').forEach(cb => {
      const oid = cb.dataset.apiExpChk;
      if (on) apiExportChecked.add(oid);
      else apiExportChecked.delete(oid);
    });
    render();
    return;
  }
  if (event.target.matches('[data-api-exp-chk]')) {
    const oid = event.target.dataset.apiExpChk;
    if (event.target.checked) apiExportChecked.add(oid);
    else apiExportChecked.delete(oid);
    render();
    return;
  }
  if (event.target.closest('#brandForm')) syncLiveDualBrand();
});
document.addEventListener('submit', event => {
  const f = event.target;
  if (f.id === 'domainDeployForm') {
    event.preventDefault();
    const fd = new FormData(f);
    const rawDomain = String(fd.get('domain') || '').trim().replace(/^https?:\/\//i, '').replace(/\/.*$/, '');
    if (!rawDomain || !/^[a-z0-9.-]+\.[a-z]{2,}$/i.test(rawDomain)) {
      toast('请输入合法的自定义域名，例如 geo.yourcompany.com');
      return;
    }
    const note = String(fd.get('note') || '').trim();
    saveDomainCfg(tenantId, {
      domain: rawDomain,
      status: '待部署审核',
      httpsEnabled: false,
      updatedAt: accNow(),
      note: note || '代理商已提交自定义域名，等待平台侧协助部署绑定'
    });
    render();
    toast(`已提交专属域名「${rawDomain}」，平台将在核验 CNAME 后完成云端托管部署`);
    return;
  }
  if (f.id === 'apiCfgForm') {
    event.preventDefault();
    const fd = new FormData(f);
    const cfg = getApiCfg(tenantId);
    cfg.ipWhitelist = String(fd.get('ipWhitelist') || '').trim();
    cfg.enabled = fd.get('enabled') !== null;
    saveApiCfg(tenantId, cfg);
    render();
    toast(cfg.enabled ? '已保存 API 安全配置（鉴权已启用）' : '已保存配置并暂停外部 API 调用');
    return;
  }
  if (f.id === 'toolAllocForm') {
    event.preventDefault();
    const o = data.orders.find(x => x.id === f.dataset.id);
    if (!o) return;
    const fd = new FormData(f);
    const amt = Number(fd.get('alloc_amount') || 0);
    const note = String(fd.get('alloc_note') || '').trim();
    const res = allocateToolWallet(tenantId, o, amt, note);
    if (!res.ok) { toast(res.msg); return; }
    $('#dialog').close();
    render();
    toast(`已成功划拨 ¥${amt.toLocaleString('zh-CN',{minimumFractionDigits:2})} 至「${o.customer}」账户（客户信源余额 ¥${res.wallet.balance.toLocaleString('zh-CN',{minimumFractionDigits:2})}）`);
    return;
  }
  if (f.id === 'renewOrderForm') {
    event.preventDefault();
    const o = data.orders.find(x => x.id === f.dataset.id);
    if (!o) return;
    const months = Math.max(1, Number(new FormData(f).get('months') || 3));
    const ver = orderVersion(o.package);
    const rates = accGetHqRates(tenantId);
    const renewFee = Number(((ver === '工具版' ? rates.toolMonthly : rates.serviceMonthly) * months).toFixed(2));
    const pay = accDeduct(tenantId, '订单续费', `续费${ver}订单「${o.customer}」${months}个月（续费基础费）`, renewFee);
    if (!pay.ok) { toast(pay.msg); updateRenewFeeUI(); return; }
    o.end = calcEndDate(o.end, months);
    o.months = Number(o.months || 3) + months;
    o.baseFee = Number((Number(o.baseFee || 0) + renewFee).toFixed(2));
    o.renewal = '已续费';
    save(storageKey, data);
    $('#dialog').close();
    render();
    toast(`续费成功！已扣 ¥${renewFee.toLocaleString('zh-CN')}，到期日顺延至 ${o.end}`);
    return;
  }
  if (f.id !== 'quotaEditForm') return;
  event.preventDefault();
  const o = data.orders.find(x => x.id === f.dataset.id);
  if (!o) return;
  const fd = new FormData(f);
  const q = ensureOrderQuota(o);
  const nextArt = Number(fd.get('lim_articles'));
  const nextCrawl = Number(fd.get('lim_crawl'));
  const nextSrc = Number(fd.get('lim_source'));
  if (nextArt < q.articles.used) { toast(`生文上限不能低于已用 ${q.articles.used} 篇`); return; }
  if (nextCrawl < q.crawl.used) { toast(`爬虫上限不能低于已用 ${q.crawl.used} 次`); return; }
  if (nextSrc < Math.ceil(Number(q.sourceSpend || 0))) { toast(`信源上限不能低于已耗 ¥${Number(q.sourceSpend || 0).toLocaleString('zh-CN')}`); return; }
  const calc = calcQuotaExpandCost(o, nextArt, nextCrawl, nextSrc);
  if (calc.total > 0) {
    openQuotaChargeConfirmModal(o, nextArt, nextCrawl, nextSrc);
    return;
  }
  q.articles.limit = nextArt;
  q.crawl.limit = nextCrawl;
  q.sourceLimit = nextSrc;
  appendOrderQuotaLog(o.id, `代理商调整额度（默认 SKU 额度内免费）：生文上限 ${nextArt} 篇、爬虫上限 ${nextCrawl} 次、信源上限 ¥${nextSrc.toLocaleString('zh-CN')}`);
  save(storageKey, data);
  $('#dialog').close();
  render();
  toast(`已更新「${o.customer}」的订单额度（在默认 SKU 额度内，未产生额外扣费）`);
});

addEventListener('hashchange',render);

render();
if (portalParams.get('open') === 'rates') openRateRulesModal();
if (portalParams.get('open') === 'neworder') newOrder();
if (portalParams.get('open') === 'quota' && data.orders[0]) {
  const o0 = data.orders[0];
  openOrderQuotaModal(o0, { lim_articles: 100, lim_crawl: 200, lim_source: 6000 });
}
if (portalParams.get('open') === 'quota-confirm' && data.orders[0]) {
  openQuotaChargeConfirmModal(data.orders[0], 100, 200, 6000);
}

</script>
</body>
</html>
