<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>GEO OEM · 优化师系统</title>
<style>
/* ==========================================================================
   GEO OEM Enterprise Design System — Unified Admin & Portal Theme
   ========================================================================== */
:root {
  --tenant-color: #1664ff;
  --blue: var(--tenant-color, #1664ff);
  --brand-hover: color-mix(in srgb, var(--blue) 86%, #06142e);
  --tint: color-mix(in srgb, var(--blue) 9%, #ffffff);
  --tint-strong: color-mix(in srgb, var(--blue) 15%, #ffffff);
  --brand-border: color-mix(in srgb, var(--blue) 26%, #ffffff);
  --brand-ring: color-mix(in srgb, var(--blue) 16%, transparent);

  --ink: #0f1d35;
  --ink-soft: #1e314f;
  --muted: #5a6d87;
  --subtle: #8496ae;
  --line: #e3eaf4;
  --line-strong: #d0dceb;
  --bg: #f4f7fc;
  --surface: #ffffff;
  --surface-subtle: #f8fafd;

  --green: #067647;
  --green-bg: #ecfdf5;
  --green-bd: #bbf7d0;
  --amber: #b45309;
  --amber-bg: #fffbeb;
  --amber-bd: #fde68a;
  --red: #be123c;
  --red-bg: #fff1f2;
  --red-bd: #fecdd3;

  --radius-sm: 8px;
  --radius-md: 11px;
  --radius-lg: 16px;
  --radius-xl: 20px;

  --shadow-xs: 0 1px 2px rgba(15, 29, 53, 0.035);
  --shadow-sm: 0 2px 8px -2px rgba(15, 29, 53, 0.05), 0 1px 3px rgba(15, 29, 53, 0.03);
  --shadow-md: 0 10px 28px -6px rgba(15, 29, 53, 0.08), 0 2px 6px rgba(15, 29, 53, 0.04);
  --shadow-dialog: 0 28px 90px -12px rgba(9, 20, 44, 0.28), 0 0 0 1px rgba(15, 29, 53, 0.06);

  --font: Inter, -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
}

*, *::before, *::after {
  box-sizing: border-box;
}

html {
  scroll-behavior: smooth;
}

body {
  margin: 0;
  color: var(--ink);
  font: 14px/1.6 var(--font);
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  background-color: var(--bg);
  background-image:
    radial-gradient(1000px 380px at 68% -60px, color-mix(in srgb, var(--blue) 7%, transparent), transparent 70%),
    radial-gradient(700px 320px at 15% -40px, rgba(56, 189, 248, 0.05), transparent 65%);
  background-attachment: fixed;
}

/* Custom Subtle Scrollbars */
::-webkit-scrollbar { width: 7px; height: 7px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 999px; }
::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

a {
  color: var(--blue);
  text-decoration: none;
  transition: color 0.16s ease, background-color 0.16s ease, border-color 0.16s ease;
}

h1, h2, h3, p {
  margin: 0;
}

h1 {
  font-size: 25px;
  font-weight: 700;
  letter-spacing: -0.025em;
  line-height: 1.28;
  color: var(--ink);
}

h2 {
  font-size: 16px;
  font-weight: 650;
  letter-spacing: -0.012em;
  color: var(--ink);
}

h3 {
  font-size: 15px;
  font-weight: 650;
  color: var(--ink);
}

.muted, small {
  color: var(--muted);
}

small {
  font-size: 12px;
  line-height: 1.45;
}

button, input, select, textarea {
  font: inherit;
}

button {
  cursor: pointer;
}

button:disabled {
  cursor: not-allowed;
  opacity: 0.5;
}

button:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, summary:focus-visible {
  outline: 2px solid var(--blue);
  outline-offset: 2px;
}

/* ==========================================================================
   App Shell: Sidebar & Sticky Glass Topbar
   ========================================================================== */
.layout {
  display: grid;
  grid-template-columns: 240px minmax(0, 1fr);
  min-height: 100vh;
}

.sidebar {
  position: sticky;
  top: 0;
  height: 100vh;
  display: flex;
  flex-direction: column;
  background: linear-gradient(180deg, #ffffff 0%, #fafcff 100%);
  border-right: 1px solid var(--line);
  box-shadow: 4px 0 24px rgba(15, 29, 53, 0.02);
  padding: 22px 14px 16px;
  overflow-y: auto;
  z-index: 35;
}

.brand {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 2px 10px 22px;
  margin-bottom: 4px;
  border-bottom: 1px solid #eef3f9;
  color: var(--ink);
}

.mark {
  min-width: 40px;
  height: 40px;
  border-radius: 11px;
  background: linear-gradient(140deg, color-mix(in srgb, var(--blue) 90%, #5cb8ff), var(--brand-hover));
  box-shadow:
    inset 0 1px 0 rgba(255, 255, 255, 0.35),
    0 6px 14px -3px color-mix(in srgb, var(--blue) 36%, transparent);
  display: grid;
  place-items: center;
  color: #ffffff;
  font-weight: 800;
  font-size: 18px;
  letter-spacing: -0.02em;
  flex-shrink: 0;
}

.brand b {
  font-size: 18px;
  font-weight: 750;
  line-height: 1.22;
  letter-spacing: -0.02em;
  color: var(--ink);
  display: block;
  overflow-wrap: anywhere;
}

html[style*="--tenant-color"] .brand b {
  color: var(--blue);
}

.brand small {
  display: inline-block;
  margin-top: 3px;
  font-size: 11px;
  font-weight: 500;
  color: var(--muted);
  letter-spacing: 0.04em;
}

.nav {
  padding-top: 8px;
}

.nav-label {
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--subtle);
  padding: 16px 12px 6px;
}

.nav a, .nav button {
  position: relative;
  display: flex;
  align-items: center;
  justify-content: flex-start;
  gap: 11px;
  width: 100%;
  padding: 9px 12px;
  min-height: 40px;
  margin-bottom: 3px;
  color: #415572;
  font-size: 13.5px;
  font-weight: 500;
  border: 1px solid transparent;
  border-radius: 10px;
  background: transparent;
  text-align: left;
  transition: all 0.16s cubic-bezier(0.16, 1, 0.3, 1);
}

.nav a i, .nav button i {
  font-style: normal;
  display: inline-grid;
  place-items: center;
  width: 20px;
  height: 20px;
  flex: none;
  color: #6b7f99;
  transition: color 0.16s ease, transform 0.16s ease;
}

.nav a i svg, .nav button i svg {
  width: 18px;
  height: 18px;
}

.nav a:hover, .nav button:hover {
  background: #f2f6fc;
  color: var(--ink);
  border-color: transparent;
}

.nav a:hover i, .nav button:hover i {
  color: var(--blue);
}

.nav a[aria-current="page"], .nav button[aria-current="page"] {
  background: var(--tint);
  color: var(--blue);
  font-weight: 650;
  border-color: color-mix(in srgb, var(--blue) 14%, transparent);
  box-shadow: 0 1px 3px color-mix(in srgb, var(--blue) 6%, transparent);
}

.nav a[aria-current="page"]::before, .nav button[aria-current="page"]::before {
  content: "";
  position: absolute;
  left: -7px;
  top: 9px;
  bottom: 9px;
  width: 3.5px;
  border-radius: 999px;
  background: var(--blue);
}

.nav a[aria-current="page"] i, .nav button[aria-current="page"] i {
  color: var(--blue);
}

.side-foot {
  margin-top: auto;
  padding: 16px 2px 0;
}

.side-foot > div {
  display: flex;
  align-items: center;
  gap: 11px;
  padding: 11px 12px;
  background: var(--surface-subtle);
  border: 1px solid var(--line);
  border-radius: 12px;
}

.side-avatar {
  position: relative;
  width: 34px;
  height: 34px;
  display: grid;
  place-items: center;
  flex: none;
  background: linear-gradient(135deg, var(--tint-strong), var(--tint));
  border: 1px solid var(--brand-border);
  color: var(--blue);
  border-radius: 50%;
  font-weight: 700;
  font-size: 13px;
}

.side-avatar::after {
  content: "";
  position: absolute;
  right: -1px;
  bottom: -1px;
  width: 9px;
  height: 9px;
  border-radius: 50%;
  background: #10b981;
  border: 2px solid #ffffff;
}

.side-foot b {
  display: block;
  color: var(--ink);
  font-size: 13px;
  font-weight: 650;
  line-height: 1.3;
}

.side-foot small {
  display: block;
  font-size: 11px;
  color: var(--subtle);
  margin-top: 1px;
}

.topbar {
  position: sticky;
  top: 0;
  z-index: 25;
  min-height: 60px;
  padding: 10px 32px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 14px;
  background: rgba(255, 255, 255, 0.84);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  border-bottom: 1px solid rgba(227, 234, 244, 0.92);
}

.path {
  display: flex;
  gap: 8px;
  align-items: center;
  font-size: 13px;
}

.path-label {
  color: var(--muted);
  font-weight: 500;
}

.path-sep {
  color: #a1b2c8;
  font-size: 14px;
}

.topbar .path b {
  color: var(--ink);
  font-weight: 650;
}

main {
  max-width: 1480px;
  margin: 0 auto;
  padding: 26px 32px 52px;
}

/* ==========================================================================
   Headers: Hero Workspace Cover & Clean Subpage Header
   ========================================================================== */
.intro, .section-head, .actions, .filters {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  flex-wrap: wrap;
}

.actions, .filters {
  justify-content: flex-start;
}

.intro:not(.workspace-cover) {
  margin: 0 0 16px;
  padding: 2px 0;
  background: transparent;
  border: 0;
  border-radius: 0;
  box-shadow: none;
  position: relative;
}

.intro:not(.workspace-cover)::before {
  display: none;
}

.intro:not(.workspace-cover) h1 {
  font-size: 20px;
  letter-spacing: -0.02em;
}

.intro p, .section-head p {
  margin-top: 4px;
  font-size: 13px;
}

.workspace-cover {
  position: relative;
  isolation: isolate;
  overflow: hidden;
  display: flex;
  align-items: center;
  min-height: 188px;
  padding: 28px 32px;
  margin-bottom: 20px;
  background:
    radial-gradient(ellipse at 86% 24%, color-mix(in srgb, var(--blue) 42%, #0ea5e9) 0%, transparent 56%),
    radial-gradient(ellipse at 65% 110%, rgba(14, 165, 233, 0.22), transparent 52%),
    linear-gradient(118deg, #071529 0%, #0b2240 58%, #10335c 100%);
  border: 1px solid rgba(56, 130, 246, 0.28);
  border-radius: var(--radius-xl);
  box-shadow: 0 14px 34px -10px rgba(8, 24, 54, 0.28), inset 0 1px 0 rgba(255, 255, 255, 0.1);
  color: #ffffff;
}

.workspace-cover h1 {
  font-size: clamp(24px, 2.6vw, 32px);
  line-height: 1.22;
  margin: 10px 0 8px;
  color: #ffffff;
  letter-spacing: -0.025em;
}

.workspace-cover p {
  margin: 0;
  color: #bfd4ee;
  font-size: 14px;
  max-width: 560px;
}

.cover-copy, .cover-action {
  position: relative;
  z-index: 1;
}

.cover-action {
  margin-top: 18px;
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
}

.cover-label {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  padding: 4px 11px;
  border-radius: 999px;
  background: rgba(255, 255, 255, 0.08);
  border: 1px solid rgba(255, 255, 255, 0.15);
  color: #bae6fd;
  font-size: 11.5px;
  font-weight: 600;
  letter-spacing: 0.05em;
  backdrop-filter: blur(6px);
}

.cover-label::before {
  content: "";
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: #38bdf8;
  box-shadow: 0 0 8px #38bdf8;
}

.cover-grid {
  position: absolute;
  inset: 0 0 0 42%;
  z-index: -1;
  opacity: 0.72;
  pointer-events: none;
  background:
    radial-gradient(circle, rgba(152, 223, 255, 0.45) 1px, transparent 1.5px) 0 0 / 24px 24px,
    repeating-linear-gradient(135deg, transparent 0 68px, rgba(119, 194, 255, 0.09) 69px 70px, transparent 71px 112px);
  mask-image: linear-gradient(90deg, transparent, #000 50%);
  -webkit-mask-image: linear-gradient(90deg, transparent, #000 50%);
}

.cover-grid::after {
  content: "";
  position: absolute;
  width: 380px;
  height: 120px;
  right: 3%;
  bottom: -26px;
  transform: rotate(-16deg);
  border: 1px solid rgba(148, 209, 247, 0.35);
  border-radius: 50%;
  box-shadow: 0 0 0 18px rgba(115, 197, 255, 0.04), 0 0 0 38px rgba(115, 197, 255, 0.03);
}

/* Cover light secondary buttons (e.g. return link inside dark cover) */
.workspace-cover .button:not(.primary) {
  background: rgba(255, 255, 255, 0.1);
  border-color: rgba(255, 255, 255, 0.22);
  color: #ffffff;
  backdrop-filter: blur(6px);
}
.workspace-cover .button:not(.primary):hover {
  background: rgba(255, 255, 255, 0.18);
  border-color: rgba(255, 255, 255, 0.38);
  color: #ffffff;
}

/* ==========================================================================
   Buttons & Action Links
   ========================================================================== */
.button, button {
  display: inline-flex;
  justify-content: center;
  align-items: center;
  gap: 6px;
  border: 1px solid var(--line-strong);
  border-radius: 9px;
  background: var(--surface);
  color: var(--ink-soft);
  font-size: 13px;
  font-weight: 600;
  padding: 7px 14px;
  min-height: 36px;
  white-space: nowrap;
  box-shadow: var(--shadow-xs);
  transition: all 0.16s cubic-bezier(0.16, 1, 0.3, 1);
}

.button:hover, button:hover {
  border-color: var(--blue);
  color: var(--blue);
  background: #fbfdff;
}

.button:active, button:active {
  transform: translateY(0.5px);
}

.primary, button.primary {
  background: linear-gradient(180deg, color-mix(in srgb, var(--blue) 94%, #ffffff) 0%, var(--blue) 100%);
  border-color: var(--blue);
  color: #ffffff;
  box-shadow:
    inset 0 1px 0 rgba(255, 255, 255, 0.22),
    0 4px 12px -2px color-mix(in srgb, var(--blue) 38%, transparent);
}

.primary:hover, button.primary:hover {
  background: linear-gradient(180deg, var(--blue) 0%, var(--brand-hover) 100%);
  border-color: var(--brand-hover);
  color: #ffffff;
  box-shadow:
    inset 0 1px 0 rgba(255, 255, 255, 0.22),
    0 6px 16px -2px color-mix(in srgb, var(--blue) 48%, transparent);
}

.cover-action .primary {
  box-shadow:
    inset 0 1px 0 rgba(255, 255, 255, 0.28),
    0 8px 22px rgba(10, 30, 82, 0.45);
}

.link-button {
  border: 1px solid transparent;
  color: var(--blue);
  padding: 4px 9px;
  min-height: 28px;
  font-size: 12.5px;
  font-weight: 600;
  background: var(--tint);
  border-radius: 7px;
  box-shadow: none;
}

.link-button:hover {
  background: var(--tint-strong);
  border-color: var(--brand-border);
  color: var(--brand-hover);
}

.order-preview {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 4px 9px;
  min-height: 28px;
  border-radius: 7px;
  font-size: 12.5px;
  font-weight: 600;
  color: var(--ink-soft);
  background: #f3f6fb;
  border: 1px solid var(--line);
  white-space: nowrap;
}

.order-preview:hover {
  color: var(--blue);
  background: var(--tint);
  border-color: var(--brand-border);
}

.cell-actions {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  flex-wrap: wrap;
}

/* ==========================================================================
   Panels, KPI Metrics & Progress Bars
   ========================================================================== */
.panel, .metric {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-sm);
}

.panel {
  margin-bottom: 18px;
  overflow: hidden;
}

.pad {
  padding: 20px 22px;
}

.section-head {
  margin-bottom: 14px;
}

.panel > .pad:has(+ .scroll) {
  padding-bottom: 14px;
}

.metrics {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 14px;
  margin-bottom: 20px;
}

.metric {
  position: relative;
  padding: 18px 20px;
  min-height: 114px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  overflow: hidden;
  transition: transform 0.18s ease, box-shadow 0.18s ease, border-color 0.18s ease;
}

.metric:hover {
  transform: translateY(-2px);
  box-shadow: var(--shadow-md);
  border-color: var(--brand-border);
}

.metric::before {
  content: "";
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  height: 3px;
  background: linear-gradient(90deg, var(--blue), #38bdf8);
  opacity: 0.85;
}

.metric:nth-child(2)::before { background: linear-gradient(90deg, #10b981, #34d399); }
.metric:nth-child(3)::before { background: linear-gradient(90deg, #f59e0b, #fbbf24); }
.metric:nth-child(4)::before { background: linear-gradient(90deg, #6366f1, #818cf8); }

.metric::after {
  content: "";
  position: absolute;
  top: -18px;
  right: -18px;
  width: 72px;
  height: 72px;
  border-radius: 50%;
  background: radial-gradient(circle, color-mix(in srgb, var(--blue) 9%, transparent) 0%, transparent 70%);
  pointer-events: none;
}

.metric span {
  color: var(--muted);
  font-size: 12.5px;
  font-weight: 600;
  letter-spacing: 0.01em;
}

.metric strong {
  display: block;
  font-size: 30px;
  font-weight: 750;
  line-height: 1.25;
  margin: 6px 0 4px;
  color: var(--ink);
  letter-spacing: -0.03em;
  font-variant-numeric: tabular-nums;
}

.metric small {
  font-size: 12px;
  color: var(--subtle);
}

.split {
  display: grid;
  grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr);
  gap: 18px;
}

.list-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 14px;
  padding: 13px 0;
  border-bottom: 1px solid #edf2f9;
}

.list-row:last-child {
  border-bottom: 0;
  padding-bottom: 2px;
}

.list-row small {
  display: block;
  margin-top: 3px;
}

.bar {
  height: 8px;
  background: #edf2fa;
  border-radius: 999px;
  overflow: hidden;
}

.bar i {
  display: block;
  height: 100%;
  background: linear-gradient(90deg, var(--blue), #38bdf8);
  border-radius: inherit;
  transition: width 0.35s cubic-bezier(0.16, 1, 0.3, 1);
}

/* ==========================================================================
   Semantic Status Badges (with Subtle Indicator Dot)
   ========================================================================== */
.badge {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  border-radius: 999px;
  background: #f1f5f9;
  border: 1px solid #e2e8f0;
  padding: 2.5px 9px;
  font-size: 12px;
  font-weight: 600;
  line-height: 1.45;
  white-space: nowrap;
  color: #475569;
}

.badge::before {
  content: "";
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: currentColor;
  opacity: 0.75;
  flex-shrink: 0;
}

.badge.green {
  color: var(--green);
  background: var(--green-bg);
  border-color: var(--green-bd);
}

.badge.blue {
  color: var(--blue);
  background: var(--tint);
  border-color: var(--brand-border);
}

.badge.amber {
  color: var(--amber);
  background: var(--amber-bg);
  border-color: var(--amber-bd);
}

.badge.red {
  color: var(--red);
  background: var(--red-bg);
  border-color: var(--red-bd);
}

/* ==========================================================================
   Filters, Inputs & Modern Form Controls
   ========================================================================== */
.filters {
  padding: 14px 18px;
  gap: 10px;
  background: #fbfcfe;
  border-bottom: 1px solid var(--line);
}

.filters > label {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  font-size: 13px;
  font-weight: 600;
  color: var(--muted);
}

.filters > .badge {
  margin-left: auto;
}

input:not([type="checkbox"]):not([type="radio"]):not([type="color"]), select, textarea {
  border: 1px solid var(--line-strong);
  border-radius: 9px;
  background: var(--surface);
  color: var(--ink);
  font-size: 13.5px;
  padding: 7px 12px;
  min-height: 38px;
  box-shadow: var(--shadow-xs);
  transition: border-color 0.16s ease, box-shadow 0.16s ease, background-color 0.16s ease;
}

input:not([type="checkbox"]):not([type="radio"]):hover, select:hover, textarea:hover {
  border-color: #b4c6de;
}

input:not([type="checkbox"]):not([type="radio"]):focus, select:focus, textarea:focus {
  outline: none;
  border-color: var(--blue);
  box-shadow: 0 0 0 3px var(--brand-ring);
  background: #ffffff;
}

input[readonly] {
  background: #f5f8fc;
  color: var(--muted);
  border-color: var(--line);
}

input[type="search"] {
  min-width: 240px;
  padding-left: 35px;

function downloadOptIntakeCsv(order) {
  const meta = getOptOrderMeta(order.id);
  const csvCell = v => '"' + String(v ?? '').replace(/"/g, '""') + '"';
  const rows = [
    ['字段', '内容'],
    ['订单ID', order.id],
    ['客户名称', order.customer],
    ['所属行业', order.industry],
    ['企业版本', orderVersion(order.package)],
    ['客户实际所在地（用于验证收录）', meta.location || '待补充'],
    ['跟单销售', order.sales],
    ['负责优化师', order.owner || '待分配'],
    ['服务周期', `${order.start} 至 ${order.end}`],
    ['核心业务与卖点', meta.sellingPoints || order.note || ''],
    ['目标推广关键词', meta.targetWords || ''],
    ['企业参考资料链接', meta.website || ''],
    ['订单备注', order.note || ''],
    ['提报表更新时间', meta.sheetUpdatedAt || formatNowStr().slice(0, 10)]
  ];
  const csv = '\uFEFF' + rows.map(r => r.map(csvCell).join(',')).join('\n');
  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `客户信息提报表-${order.customer}-${order.id}.csv`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

function bumpOrderCrawlCount(orderId, count = 1) {
  try {
    const pKey = tenantId === 'OEM-001' ? 'geo-oem-partner-v9' : 'geo-oem-partner-v9-' + tenantId;
    const saved = JSON.parse(localStorage.getItem(pKey) || 'null');
    if (saved && Array.isArray(saved.orders)) {
      const ord = saved.orders.find(x => x.id === orderId);
      if (ord) {
        if (!ord.quotas) ord.quotas = { articles: { used: 0, limit: 80 }, crawl: { used: 0, limit: 150 }, sourceSpend: 0, sourceLimit: 5000 };
        if (!ord.quotas.crawl) ord.quotas.crawl = { used: 0, limit: 150 };
        ord.quotas.crawl.used = Number(ord.quotas.crawl.used || 0) + Number(count || 1);
        localStorage.setItem(pKey, JSON.stringify(saved));
      }
    }
  } catch {}
}

function accLoad(key, def) {
  try {
    const raw = localStorage.getItem(key);
    return raw ? JSON.parse(raw) : structuredClone(def);
  } catch { return structuredClone(def); }
}
function accSave(key, val) {
  try { localStorage.setItem(key, JSON.stringify(val)); } catch {}
}
function accNow() {
  const d = new Date(), p = n => String(n).padStart(2,'0');
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
}
function accGetBalance(tid='OEM-001') {
  const map = accLoad(ACC_KEYS.balances, DEFAULT_BALANCES);
  return Number(map[tid] ?? 0);
}
function accDeduct(tid, type, desc, cost) {
  const bal = accGetBalance(tid);
  if (bal < cost) {
    return { ok: false, balance: bal, msg: `账户余额不足（当前余额 ¥${bal.toFixed(2)}，本次需扣 ¥${Number(cost).toFixed(2)}），请联系商务通过 CRM 充值入账。` };
  }
  const map = accLoad(ACC_KEYS.balances, DEFAULT_BALANCES);
  const next = Number((bal - Number(cost)).toFixed(2));
  map[tid] = next;
  accSave(ACC_KEYS.balances, map);
  const recs = accLoad(ACC_KEYS.records, DEFAULT_RECORDS);
  recs.unshift({
    id: 'LS-' + (1009 + recs.length),
    time: accNow(), partner: tid, type, desc,
    amount: -Number(Number(cost).toFixed(2)),
    after: next
  });
  accSave(ACC_KEYS.records, recs);
  return { ok: true, balance: next };
}

function ensureDetectionsForAssignedOrders() {
  let changed = false;
  for (const o of data.orders) {
    if (!kwDetections.some(r => r.orderId === o.id)) {
      kwDetections.push(
        { uid:'KD-' + o.id.slice(-4) + '-1', orderId:o.id, customer:o.customer, keyword:`${o.industry}头部服务商推荐`, wordType:'品类词', platform:'DeepSeek', rank:'未上榜', position:'—', change:'待首次复测', checkedAt:'暂未检测', snippet:'尚未发起该词的 AI 平台抓取复测。', note:'新分配订单，请点击复测启动首轮检测。' },
        { uid:'KD-' + o.id.slice(-4) + '-2', orderId:o.id, customer:o.customer, keyword:`${o.customer}怎么样`, wordType:'品牌词', platform:'豆包', rank:'未上榜', position:'—', change:'待首次复测', checkedAt:'暂未检测', snippet:'尚未发起该词的 AI 平台抓取复测。', note:'新分配订单，请点击复测启动首轮检测。' }
      );
      changed = true;
    }
  }
  if (changed) save(detectionKey, kwDetections);
}

const detFilter = { quick:'all', customer:'全部客户', orderId:'全部订单', platform:'全部平台', rank:'全部状态', search:'' };

function getScopedDetections() {
  ensureDetectionsForAssignedOrders();
  const orderIds = new Set(data.orders.map(o => o.id));
  return kwDetections.filter(r => orderIds.has(r.orderId));
}

function getFilteredDetections() {
  const base = getScopedDetections();
  const q = detFilter.search.trim().toLowerCase();
  return base.filter(r =>
    (detFilter.quick === 'all' || r.rank === detFilter.quick) &&
    (detFilter.customer === '全部客户' || r.customer === detFilter.customer) &&
    (detFilter.orderId === '全部订单' || r.orderId === detFilter.orderId) &&
    (detFilter.platform === '全部平台' || r.platform === detFilter.platform) &&
    (detFilter.rank === '全部状态' || r.rank === detFilter.rank) &&
    (!q || [r.keyword, r.customer, r.orderId, r.platform, r.wordType].some(v => String(v||'').toLowerCase().includes(q)))
  );
}

function syncOrderRankFromKeywords(orderId) {
  const rows = kwDetections.filter(r => r.orderId === orderId);
  if (!rows.length) return;
  const nextRank = rows.some(r => r.rank === '掉榜') ? '掉榜' : (rows.some(r => r.rank === '在榜') ? '在榜' : '未上榜');
  const order = data.orders.find(o => o.id === orderId);
  if (order) order.rank = nextRank;
  const cacheKey = 'geo-oem-account-' + portalRole + '-' + portalAccount + tenantSuffix;
  const changes = load(cacheKey, {});
  changes[orderId] = { ...changes[orderId], rank: nextRank };
  save(cacheKey, changes);
  persistOptimizerOrderPatch(orderId, { rank: nextRank });
}

function formatNowStr() {
  const d = new Date();
  const p = n => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
}

function detectionPage() {
  const scoped = getScopedDetections();
  const filtered = getFilteredDetections();
  const customers = [...new Set(data.orders.map(o => o.customer))];
  const orderChoices = data.orders.filter(o => detFilter.customer === '全部客户' || o.customer === detFilter.customer);
  if (detFilter.orderId !== '全部订单' && !orderChoices.some(o => o.id === detFilter.orderId)) {
    detFilter.orderId = '全部订单';
  }
  const uniqueKwCount = new Set(filtered.map(r => r.keyword)).size;
  const cntIn = filtered.filter(r => r.rank === '在榜').length;
  const cntDrop = filtered.filter(r => r.rank === '掉榜').length;
  const cntMiss = filtered.filter(r => r.rank === '未上榜').length;
  const hitRate = filtered.length ? Math.round((cntIn / filtered.length) * 100) : 0;

  const totalIn = scoped.filter(r => r.rank === '在榜').length;
  const totalDrop = scoped.filter(r => r.rank === '掉榜').length;
  const totalMiss = scoped.filter(r => r.rank === '未上榜').length;

    </div>`) +
    `<div class="metrics">
      ${metric('监测词条（词×平台）', filtered.length, `共 ${uniqueKwCount} 个独立检测词`)}
      ${metric('当前在榜', cntIn, `在榜率 ${hitRate}%`)}
      ${metric('掉榜预警', cntDrop, cntDrop ? '需优先补内容并复测' : '当前无掉榜词')}
      ${metric('未上榜', cntMiss, '待铺设信源')}
    </div>
    <section class="panel">
      <div class="det-pills">
        <button type="button" class="det-pill ${detFilter.quick==='all'?'active':''}" data-det-quick="all">全部词条 <i>${scoped.length}</i></button>
        <button type="button" class="det-pill ${detFilter.quick==='在榜'?'active':''}" data-det-quick="在榜">在榜 <i>${totalIn}</i></button>
        <button type="button" class="det-pill danger ${detFilter.quick==='掉榜'?'active':''}" data-det-quick="掉榜">掉榜预警 <i>${totalDrop}</i></button>

        <select id="detOrder" aria-label="筛选订单ID">
          <option value="全部订单" ${detFilter.orderId==='全部订单'?'selected':''}>全部订单 ID</option>
          ${orderChoices.map(o => `<option value="${esc(o.id)}" ${detFilter.orderId===o.id?'selected':''}>${esc(o.id)} · ${esc(o.customer)}</option>`).join('')}
        </select>

        <select id="detRank" aria-label="筛选榜单状态">${options(['全部状态','在榜','掉榜','未上榜'], detFilter.rank)}</select>

function detectionRows() {
  const rows = getFilteredDetections();
  return table(
    ['检测词','AI 平台','榜单状态','推荐位 / 变化','客户 / 订单 ID','最近检测时间','操作'],
    rows.map(r => {
      const pCls = DET_PLAT_CLASS[r.platform] || 'plat-km';
      const changeCls = r.rank === '掉榜' ? 'det-change-down' : (String(r.change||'').includes('↑') ? 'det-change-up' : 'muted');
      return [
        `<b>${esc(r.keyword)}</b><br><span class="kw-type-chip">${esc(r.wordType || '选型词')}</span>`,
        `<span class="plat-tag ${pCls}">${esc(r.platform)}</span>`,
        tag(r.rank),
        `<b style="white-space:nowrap">${esc(r.position || '—')}</b><br><span class="${changeCls}">${esc(r.change || '—')}</span>`,
        `<b>${esc(r.customer)}</b><br><small style="white-space:nowrap">${esc(r.orderId)}</small>`,
        `<small style="white-space:nowrap">${esc(r.checkedAt)}</small>`,
        `<button class="link-button" data-det-recheck="${esc(r.uid)}">复测</button>　<button class="link-button" data-det-snap="${esc(r.uid)}">回答快照</button>`
      ];
    })
  ) + `<div class="table-foot">共 ${rows.length} 条（词 × 平台）监测记录</div>`;
}

document.addEventListener('input', event => {
  if (event.target.id === 'detSearch') {
    detFilter.search = event.target.value;
    $('#detectionResults').innerHTML = detectionRows();
  }
});
document.addEventListener('change', event => {
  if (event.target.id === 'detCustomer') {
    detFilter.customer = event.target.value;
    detFilter.orderId = '全部订单';
    render();
    return;
  }
  if (event.target.id === 'detOrder') { detFilter.orderId = event.target.value; render(); return; }
  if (event.target.id === 'detPlatform') { detFilter.platform = event.target.value; render(); return; }
  if (event.target.id === 'detRank') { detFilter.rank = event.target.value; render(); return; }
});
document.addEventListener('click', event => {
  const qBtn = event.target.closest('[data-det-quick]');
  if (qBtn) {
    detFilter.quick = qBtn.dataset.detQuick;
    detFilter.rank = '全部状态';
    render();
    return;
  }
  const actBtn = event.target.closest('[data-det-act]');
  if (actBtn) {
    const a = actBtn.dataset.detAct;
    if (a === 'reset') {
      Object.assign(detFilter, { quick:'all', customer:'全部客户', orderId:'全部订单', platform:'全部平台', rank:'全部状态', search:'' });
      render();
      return;
    }
    if (a === 'add-kw') { openAddKwModal(); return; }
    if (a === 'batch-recheck') {
      const drops = getFilteredDetections().filter(r => r.rank === '掉榜');
      if (!drops.length) { toast('当前筛选下没有掉榜词条'); return; }
      const unitCrawl = accGetCrawlUnitPrice(tenantId);
      const totalCost = Number((unitCrawl * drops.length).toFixed(2));
      const res = accDeduct(tenantId, '爬虫消耗', `优化师批量复测掉榜词 × ${drops.length} 次（¥${unitCrawl.toFixed(2)}/次）`, totalCost);
      if (!res.ok) { toast(res.msg); return; }
      const now = formatNowStr();
      const touchedOrders = new Set();
      drops.forEach((r, idx) => {
        r.checkedAt = now;
        if (idx % 2 === 0) {
          r.rank = '在榜';
          r.position = '第 3 位';
          r.change = '↑ 恢复在榜';
          r.snippet = `${r.platform} 最新回答已重新收录【${r.customer}】在「${r.keyword}」场景的评测信源，位列推荐第 3 位。`;
        } else {
          r.change = '仍掉榜 · 需补稿';
        }
        touchedOrders.add(r.orderId);
        bumpOrderCrawlCount(r.orderId, 1);
      });
      save(detectionKey, kwDetections);
      touchedOrders.forEach(syncOrderRankFromKeywords);
      render();
      toast(`批量复测完成（× ${drops.length} 次），按次扣除爬虫费 ¥${totalCost.toFixed(2)}`);
      return;
    }
  }
  const snap = event.target.closest('[data-det-snap]');
  if (snap) {
    const r = kwDetections.find(x => x.uid === snap.dataset.detSnap);
    if (!r) return;
    modal(`${r.keyword} · ${r.platform} 回答快照`, details([
      ['检测词', r.keyword],
      ['AI 平台', r.platform],
      ['客户 / 订单 ID', `${r.customer}（${r.orderId}）`],
      ['榜单状态', r.rank],
      ['推荐位 / 变化', `${r.position || '—'}（${r.change || '—'}）`],
      ['最近检测时间', r.checkedAt],
      ['AI 回答摘要', r.snippet || '—'],
      ['诊断与备注', r.note || '—']
    ]) + `<div class="actions"><button type="button" class="primary" data-det-recheck="${esc(r.uid)}">立即复测此词</button></div>`);
    return;
  }
  const rc = event.target.closest('[data-det-recheck]');
  if (rc) {
    const r = kwDetections.find(x => x.uid === rc.dataset.detRecheck);
    if (r) openKwRecheckModal(r);
    return;
  }
});
document.addEventListener('submit', event => {
  const form = event.target;
  if (form.id === 'saveKwRecheck') {
    event.preventDefault();
    const r = kwDetections.find(x => x.uid === form.dataset.uid);
    if (!r) return;
    const { note } = Object.fromEntries(new FormData(form));
    const crawlCost = accGetCrawlUnitPrice(tenantId);
    const res = accDeduct(tenantId, '爬虫消耗', `爬虫实时复测「${r.keyword}」(${r.platform} · ${r.orderId}) × 1 次（¥${crawlCost.toFixed(2)}/次）`, crawlCost);
    if (!res.ok) { toast(res.msg); return; }
    // 榜单状态完全由后台爬虫实时抓取结果决定，不可人工指定
    const prevRank = r.rank;
    const prevPos = r.position;
    const seed = (Date.now() + r.keyword.length * 13) % 10;
    const crawledRank = prevRank === '掉榜'
      ? (seed < 7 ? '在榜' : '掉榜')
      : (prevRank === '未上榜' ? (seed < 6 ? '在榜' : '未上榜') : (seed < 8 ? '在榜' : '掉榜'));
    const crawledPos = crawledRank === '在榜'
      ? `第 ${(seed % 3) + 1} 位`
      : (crawledRank === '掉榜' ? (prevRank === '在榜' ? '原' + prevPos : prevPos) : '—');
    r.rank = crawledRank;
    r.position = crawledPos;
    r.change = crawledRank === '在榜'
      ? (prevRank !== '在榜' ? '↑ 爬虫检测恢复在榜' : '爬虫核验稳定在榜')
      : (crawledRank === '掉榜' ? '↓ 爬虫检测掉出前 5' : '爬虫检测暂未命中');
    r.checkedAt = formatNowStr();
    r.note = (note || '').trim() || r.note;
    r.snippet = crawledRank === '在榜'
      ? `后台爬虫实时抓取：${r.platform} 最新回答已命中【${r.customer}】，围绕「${r.keyword}」位列推荐 ${r.position}。`
      : `后台爬虫实时抓取：${r.platform} 最新回答暂未提及【${r.customer}】，建议补充「${r.keyword}」相关第三方信源后再复测。`;
    save(detectionKey, kwDetections);
    bumpOrderCrawlCount(r.orderId, 1);
    syncOrderRankFromKeywords(r.orderId);
    $('#dialog').close();
    render();
    toast(`爬虫复测完成：实际返回「${crawledRank}${crawledRank==='在榜'?' · '+crawledPos:''}」，按次扣爬虫费 ¥${crawlCost.toFixed(2)}（1 次）`);
    return;
  }
  if (form.id === 'addKwDetectForm') {
    event.preventDefault();
    const fd = new FormData(form);
    const orderId = String(fd.get('orderId') || '');
    const keyword = String(fd.get('keyword') || '').trim();
    const wordType = String(fd.get('wordType') || '选型词');
    const plats = fd.getAll('platforms');
    const order = data.orders.find(o => o.id === orderId);
    if (!order || !keyword || !plats.length) { toast('请填写检测词并至少勾选 1 个 AI 平台'); return; }
    const unitCrawl = accGetCrawlUnitPrice(tenantId);
    const totalCost = Number((unitCrawl * plats.length).toFixed(2));
    const res = accDeduct(tenantId, '爬虫消耗', `新增词检测「${keyword}」× ${plats.length} 次（${order.id} · ¥${unitCrawl.toFixed(2)}/次）`, totalCost);
    if (!res.ok) { toast(res.msg); return; }
    bumpOrderCrawlCount(order.id, plats.length);
    const now = formatNowStr();
    plats.forEach((pl, idx) => {
      const hit = idx % 2 === 0;
      kwDetections.unshift({
        uid: 'KD-' + Date.now() + '-' + idx,
        orderId: order.id,
        customer: order.customer,
        keyword,
        wordType,
        platform: pl,
        rank: hit ? '在榜' : '未上榜',
        position: hit ? `第 ${(idx % 3) + 1} 位` : '—',
        change: hit ? '首次检测在榜' : '待铺设信源',
        checkedAt: now,
        snippet: hit ? `${pl} 回答中已推荐【${order.customer}】，在「${keyword}」问题下位列前 3。` : `${pl} 当前回答尚未提及【${order.customer}】，建议围绕「${keyword}」铺设内容。`,
        note: '新增词检测首轮抓取结果'
      });
    });
    save(detectionKey, kwDetections);
    syncOrderRankFromKeywords(order.id);
    $('#dialog').close();
    render();
    toast(`已完成 ${plats.length} 个平台检测，扣除爬虫花费 ¥${totalCost.toFixed(2)}`);
  }
});

render();

// 我的优化项目筛选 & 客户信息提报表事件
document.addEventListener('change', event => {
  if (['optProjService', 'optProjRank', 'optProjCycle', 'optProjSales'].includes(event.target.id)) {
    const map = { optProjService: 'service', optProjRank: 'rank', optProjCycle: 'cycle', optProjSales: 'sales' };
    optProjFilter[map[event.target.id]] = event.target.value;
    render();
  }
});
document.addEventListener('click', event => {
  const btnEl = event.target.closest('[data-opt-act]');
  if (!btnEl) return;
  const act = btnEl.dataset.optAct;
  if (act === 'reset-proj-filter') {
    Object.assign(optProjFilter, { service: '所有服务状态', rank: '所有榜单状态', cycle: '所有服务周期', sales: '全部跟单销售', search: '' });
    render();
    return;
  }
  const order = data.orders.find(o => o.id === btnEl.dataset.id);
  if (!order) return;
  if (act === 'download-sheet') {
    downloadOptIntakeCsv(order);
    toast(`已下载「${order.customer}」客户信息提报表（CSV）`);
    return;
  }
  if (act === 'update-sheet') {
    openOptIntakeModal(order);
  }
});
document.addEventListener('submit', event => {
  const form = event.target;
  if (form.id === 'optProjForm') {
    event.preventDefault();
    optProjFilter.search = $('#optProjSearch')?.value || '';
    render();
    return;
  }
  if (form.id === 'optIntakeForm') {
    event.preventDefault();
    const orderId = form.dataset.id;
    const order = data.orders.find(o => o.id === orderId);
    if (!order) return;
    const fd = new FormData(form);
    const fileInput = form.querySelector('[name="sheetFileInput"]');
    const pickedFile = fileInput?.files?.[0]?.name || '';
    const prev = getOptOrderMeta(orderId);
    const location = String(fd.get('location') || '').trim();
    const note = String(fd.get('note') || '').trim();
    saveOptOrderMeta(orderId, {
      location,
      sellingPoints: String(fd.get('sellingPoints') || '').trim(),
      targetWords: String(fd.get('targetWords') || '').trim(),
      website: String(fd.get('website') || '').trim(),
      sheetUploaded: true,
      sheetFile: pickedFile || prev.sheetFile || `${order.customer}_客户信息提报表.csv`,
      sheetUpdatedAt: formatNowStr().slice(0, 10)
    });
    if (note !== (order.note || '')) {
      order.note = note;
      persistOptimizerOrderPatch(orderId, { note });
    }
    $('#dialog').close();
    render();
    toast(`已更新「${order.customer}」客户所在地与信息提报表`);
  }
});
if (portalParams.get('open') === 'edit' && data.orders[0]) editOrder(data.orders[0]);

</script>
