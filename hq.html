<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>GEO OEM · 超级管理员后台</title>
<style>
/* ==========================================================================
   GEO OEM Enterprise Design System — Unified Admin & Portal Theme
   ========================================================================== */
:root {
  --tenant-color: #1664ff;
  --blue: var(--tenant-color, #1664ff);
  --brand-hover: color-mix(in srgb, var(--blue) 86%, #06142e);
  --tint: color-mix(in srgb, var(--blue) 9%, #ffffff);
  --tint-strong: color-mix(in srgb, var(--blue) 15%, #ffffff);
  --brand-border: color-mix(in srgb, var(--blue) 26%, #ffffff);
  --brand-ring: color-mix(in srgb, var(--blue) 16%, transparent);

  --ink: #0f1d35;
  --ink-soft: #1e314f;
  --muted: #5a6d87;
  --subtle: #8496ae;
  --line: #e3eaf4;
  --line-strong: #d0dceb;
  --bg: #f4f7fc;
  --surface: #ffffff;
  --surface-subtle: #f8fafd;

  --green: #067647;
  --green-bg: #ecfdf5;
  --green-bd: #bbf7d0;
  --amber: #b45309;
  --amber-bg: #fffbeb;
  --amber-bd: #fde68a;
  --red: #be123c;
  --red-bg: #fff1f2;
  --red-bd: #fecdd3;

  --radius-sm: 8px;
  --radius-md: 11px;
  --radius-lg: 16px;
  --radius-xl: 20px;

  --shadow-xs: 0 1px 2px rgba(15, 29, 53, 0.035);
  --shadow-sm: 0 2px 8px -2px rgba(15, 29, 53, 0.05), 0 1px 3px rgba(15, 29, 53, 0.03);
  --shadow-md: 0 10px 28px -6px rgba(15, 29, 53, 0.08), 0 2px 6px rgba(15, 29, 53, 0.04);
  --shadow-dialog: 0 28px 90px -12px rgba(9, 20, 44, 0.28), 0 0 0 1px rgba(15, 29, 53, 0.06);

  --font: Inter, -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
}

*, *::before, *::after {
  box-sizing: border-box;
}

html {
  scroll-behavior: smooth;
}

body {
  margin: 0;
  color: var(--ink);
  font: 14px/1.6 var(--font);
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  background-color: var(--bg);
  background-image:
    radial-gradient(1000px 380px at 68% -60px, color-mix(in srgb, var(--blue) 7%, transparent), transparent 70%),
    radial-gradient(700px 320px at 15% -40px, rgba(56, 189, 248, 0.05), transparent 65%);
  background-attachment: fixed;
}

/* Custom Subtle Scrollbars */
::-webkit-scrollbar { width: 7px; height: 7px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 999px; }
::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

a {
  color: var(--blue);
  text-decoration: none;
  transition: color 0.16s ease, background-color 0.16s ease, border-color 0.16s ease;
}

h1, h2, h3, p {
  margin: 0;
}

h1 {
  font-size: 25px;
  font-weight: 700;
  letter-spacing: -0.025em;
  line-height: 1.28;
  color: var(--ink);
}

h2 {
  font-size: 16px;
  font-weight: 650;
  letter-spacing: -0.012em;
  color: var(--ink);
}

h3 {
  font-size: 15px;
  font-weight: 650;
  color: var(--ink);
}

.muted, small {
  color: var(--muted);
}

small {
  font-size: 12px;
  line-height: 1.45;
}

button, input, select, textarea {
  font: inherit;
}

button {
  cursor: pointer;
}

button:disabled {
  cursor: not-allowed;
  opacity: 0.5;
}

button:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, summary:focus-visible {
  outline: 2px solid var(--blue);
  outline-offset: 2px;
}

/* ==========================================================================
   App Shell: Sidebar & Sticky Glass Topbar
   ========================================================================== */
.layout {
  display: grid;
  grid-template-columns: 240px minmax(0, 1fr);
  min-height: 100vh;
}

.sidebar {
  position: sticky;
  top: 0;
  height: 100vh;
  display: flex;
  flex-direction: column;
  background: linear-gradient(180deg, #ffffff 0%, #fafcff 100%);
  border-right: 1px solid var(--line);
  box-shadow: 4px 0 24px rgba(15, 29, 53, 0.02);
  padding: 22px 14px 16px;
  overflow-y: auto;
  z-index: 35;
}

.brand {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 2px 10px 22px;
  margin-bottom: 4px;
  border-bottom: 1px solid #eef3f9;
  color: var(--ink);
}

.mark {
  min-width: 40px;
  height: 40px;
  border-radius: 11px;
  background: linear-gradient(140deg, color-mix(in srgb, var(--blue) 90%, #5cb8ff), var(--brand-hover));
  box-shadow:
    inset 0 1px 0 rgba(255, 255, 255, 0.35),
    0 6px 14px -3px color-mix(in srgb, var(--blue) 36%, transparent);
  display: grid;
  place-items: center;
  color: #ffffff;
  font-weight: 800;
  font-size: 18px;
  letter-spacing: -0.02em;
  flex-shrink: 0;
}

.brand b {
  font-size: 18px;
  font-weight: 750;
  line-height: 1.22;
  letter-spacing: -0.02em;
  color: var(--ink);
  display: block;
  overflow-wrap: anywhere;
}

html[style*="--tenant-color"] .brand b {
  color: var(--blue);
}

.brand small {
  display: inline-block;
  margin-top: 3px;
  font-size: 11px;
  font-weight: 500;
  color: var(--muted);
  letter-spacing: 0.04em;
}

.nav {
  padding-top: 8px;
}

.nav-label {
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--subtle);
  padding: 16px 12px 6px;
}

.nav a, .nav button {
  position: relative;
  display: flex;
  align-items: center;
  justify-content: flex-start;
  gap: 11px;
  width: 100%;
  padding: 9px 12px;
  min-height: 40px;
  margin-bottom: 3px;
  color: #415572;
  font-size: 13.5px;
  font-weight: 500;
  border: 1px solid transparent;
  border-radius: 10px;
  background: transparent;
  text-align: left;
  transition: all 0.16s cubic-bezier(0.16, 1, 0.3, 1);
}

.nav a i, .nav button i {
  font-style: normal;
  display: inline-grid;
  place-items: center;
  width: 20px;
  height: 20px;
  flex: none;
  color: #6b7f99;
  transition: color 0.16s ease, transform 0.16s ease;
}

.nav a i svg, .nav button i svg {
  width: 18px;
  height: 18px;
}

.nav a:hover, .nav button:hover {
  background: #f2f6fc;
  color: var(--ink);
  border-color: transparent;
}

.nav a:hover i, .nav button:hover i {
  color: var(--blue);
}

.nav a[aria-current="page"], .nav button[aria-current="page"] {
  background: var(--tint);
  color: var(--blue);
  font-weight: 650;
  border-color: color-mix(in srgb, var(--blue) 14%, transparent);
  box-shadow: 0 1px 3px color-mix(in srgb, var(--blue) 6%, transparent);
}

.nav a[aria-current="page"]::before, .nav button[aria-current="page"]::before {
  content: "";
  position: absolute;
  left: -7px;
  top: 9px;
  bottom: 9px;
  width: 3.5px;
  border-radius: 999px;
  background: var(--blue);
}

.nav a[aria-current="page"] i, .nav button[aria-current="page"] i {
  color: var(--blue);
}

.side-foot {
  margin-top: auto;
  padding: 16px 2px 0;
}

.side-foot > div {
  display: flex;
  align-items: center;
  gap: 11px;
  padding: 11px 12px;
  background: var(--surface-subtle);
  border: 1px solid var(--line);
  border-radius: 12px;
}

.side-avatar {
  position: relative;
  width: 34px;
  height: 34px;
  display: grid;
  place-items: center;
  flex: none;
  background: linear-gradient(135deg, var(--tint-strong), var(--tint));
  border: 1px solid var(--brand-border);
  color: var(--blue);
  border-radius: 50%;
  font-weight: 700;
  font-size: 13px;
}

.side-avatar::after {
  content: "";
  position: absolute;
  right: -1px;
  bottom: -1px;
  width: 9px;
  height: 9px;
  border-radius: 50%;
  background: #10b981;
  border: 2px solid #ffffff;
}

.side-foot b {
  display: block;
  color: var(--ink);
  font-size: 13px;
  font-weight: 650;
  line-height: 1.3;
}

.side-foot small {
  display: block;
  font-size: 11px;
  color: var(--subtle);
  margin-top: 1px;
}

.topbar {
  position: sticky;
  top: 0;
  z-index: 25;
  min-height: 60px;
  padding: 10px 32px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 14px;
  background: rgba(255, 255, 255, 0.84);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  border-bottom: 1px solid rgba(227, 234, 244, 0.92);
}

.path {
  display: flex;
  gap: 8px;
  align-items: center;
  font-size: 13px;
}

.path-label {
  color: var(--muted);
  font-weight: 500;
}

.path-sep {
  color: #a1b2c8;
  font-size: 14px;
}

.topbar .path b {
  color: var(--ink);
  font-weight: 650;
}

main {
  max-width: 1480px;
  margin: 0 auto;
  padding: 26px 32px 52px;
}

/* ==========================================================================
   Headers: Hero Workspace Cover & Clean Subpage Header
   ========================================================================== */
.intro, .section-head, .actions, .filters {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  flex-wrap: wrap;
}

.actions, .filters {
  justify-content: flex-start;
}

.intro:not(.workspace-cover) {
  margin: 0 0 16px;
  padding: 2px 0;
  background: transparent;
  border: 0;
  border-radius: 0;
  box-shadow: none;
  position: relative;
}

.intro:not(.workspace-cover)::before {
  display: none;
}

.intro:not(.workspace-cover) h1 {
  font-size: 20px;
  letter-spacing: -0.02em;
}

.intro p, .section-head p {
  margin-top: 4px;
  font-size: 13px;
}

.workspace-cover {
  position: relative;
  isolation: isolate;
  overflow: hidden;
  display: flex;
  align-items: center;
  min-height: 188px;
  padding: 28px 32px;
  margin-bottom: 20px;
  background:
    radial-gradient(ellipse at 86% 24%, color-mix(in srgb, var(--blue) 42%, #0ea5e9) 0%, transparent 56%),
    radial-gradient(ellipse at 65% 110%, rgba(14, 165, 233, 0.22), transparent 52%),
    linear-gradient(118deg, #071529 0%, #0b2240 58%, #10335c 100%);
  border: 1px solid rgba(56, 130, 246, 0.28);
  border-radius: var(--radius-xl);
  box-shadow: 0 14px 34px -10px rgba(8, 24, 54, 0.28), inset 0 1px 0 rgba(255, 255, 255, 0.1);
  color: #ffffff;
}

.workspace-cover h1 {
  font-size: clamp(24px, 2.6vw, 32px);
  line-height: 1.22;
  margin: 10px 0 8px;
  color: #ffffff;
  letter-spacing: -0.025em;
}

.workspace-cover p {
  margin: 0;
  color: #bfd4ee;
  font-size: 14px;
  max-width: 560px;
}

.cover-copy, .cover-action {
  position: relative;
  z-index: 1;
}

.cover-action {
  margin-top: 18px;
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
}

.cover-label {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  padding: 4px 11px;
  border-radius: 999px;
  background: rgba(255, 255, 255, 0.08);
  border: 1px solid rgba(255, 255, 255, 0.15);
  color: #bae6fd;
  font-size: 11.5px;
  font-weight: 600;
  letter-spacing: 0.05em;
  backdrop-filter: blur(6px);
}

.cover-label::before {
  content: "";
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: #38bdf8;
  box-shadow: 0 0 8px #38bdf8;
}

.cover-grid {
  position: absolute;
  inset: 0 0 0 42%;
  z-index: -1;
  opacity: 0.72;
  pointer-events: none;
  background:
    radial-gradient(circle, rgba(152, 223, 255, 0.45) 1px, transparent 1.5px) 0 0 / 24px 24px,
    repeating-linear-gradient(135deg, transparent 0 68px, rgba(119, 194, 255, 0.09) 69px 70px, transparent 71px 112px);
  mask-image: linear-gradient(90deg, transparent, #000 50%);
  -webkit-mask-image: linear-gradient(90deg, transparent, #000 50%);
}

.cover-grid::after {
  content: "";
  position: absolute;
  width: 380px;
  height: 120px;
  right: 3%;
  bottom: -26px;
  transform: rotate(-16deg);
  border: 1px solid rgba(148, 209, 247, 0.35);
  border-radius: 50%;
  box-shadow: 0 0 0 18px rgba(115, 197, 255, 0.04), 0 0 0 38px rgba(115, 197, 255, 0.03);
}

/* Cover light secondary buttons (e.g. return link inside dark cover) */
.workspace-cover .button:not(.primary) {
  background: rgba(255, 255, 255, 0.1);
  border-color: rgba(255, 255, 255, 0.22);
  color: #ffffff;
  backdrop-filter: blur(6px);
}
.workspace-cover .button:not(.primary):hover {
  background: rgba(255, 255, 255, 0.18);
  border-color: rgba(255, 255, 255, 0.38);
  color: #ffffff;
}

/* ==========================================================================
   Buttons & Action Links
   ========================================================================== */
.button, button {
  display: inline-flex;
  justify-content: center;
  align-items: center;
  gap: 6px;
  border: 1px solid var(--line-strong);
  border-radius: 9px;
  background: var(--surface);
  color: var(--ink-soft);
  font-size: 13px;
  font-weight: 600;
  padding: 7px 14px;
  min-height: 36px;
  white-space: nowrap;
  box-shadow: var(--shadow-xs);
  transition: all 0.16s cubic-bezier(0.16, 1, 0.3, 1);
}

.button:hover, button:hover {
  border-color: var(--blue);
  color: var(--blue);
  background: #fbfdff;
}

.button:active, button:active {
  transform: translateY(0.5px);
}

.primary, button.primary {
  background: linear-gradient(180deg, color-mix(in srgb, var(--blue) 94%, #ffffff) 0%, var(--blue) 100%);
  border-color: var(--blue);
  color: #ffffff;
  box-shadow:
    inset 0 1px 0 rgba(255, 255, 255, 0.22),
    0 4px 12px -2px color-mix(in srgb, var(--blue) 38%, transparent);
}

.primary:hover, button.primary:hover {
  background: linear-gradient(180deg, var(--blue) 0%, var(--brand-hover) 100%);
  border-color: var(--brand-hover);
  color: #ffffff;
  box-shadow:
    inset 0 1px 0 rgba(255, 255, 255, 0.22),
    0 6px 16px -2px color-mix(in srgb, var(--blue) 48%, transparent);
}

.cover-action .primary {
  box-shadow:
    inset 0 1px 0 rgba(255, 255, 255, 0.28),
    0 8px 22px rgba(10, 30, 82, 0.45);
}

.link-button {
  border: 1px solid transparent;
  color: var(--blue);
  padding: 4px 9px;
  min-height: 28px;
  font-size: 12.5px;
  font-weight: 600;
  background: var(--tint);
  border-radius: 7px;
  box-shadow: none;
}

.link-button:hover {
  background: var(--tint-strong);
  border-color: var(--brand-border);
  color: var(--brand-hover);
}

.order-preview {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 4px 9px;
  min-height: 28px;
  border-radius: 7px;
  font-size: 12.5px;
  font-weight: 600;
  color: var(--ink-soft);
  background: #f3f6fb;
  border: 1px solid var(--line);
  white-space: nowrap;
}

.order-preview:hover {
  color: var(--blue);
  background: var(--tint);
  border-color: var(--brand-border);
}

.cell-actions {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  flex-wrap: wrap;
}

/* ==========================================================================
   Panels, KPI Metrics & Progress Bars
   ========================================================================== */
.panel, .metric {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-sm);
}

.panel {
  margin-bottom: 18px;
  overflow: hidden;
}

.pad {
  padding: 20px 22px;
}

.section-head {
  margin-bottom: 14px;
}

.panel > .pad:has(+ .scroll) {
  padding-bottom: 14px;
}

.metrics {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 14px;
  margin-bottom: 20px;
}

.metric {
  position: relative;
  padding: 18px 20px;
  min-height: 114px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  overflow: hidden;
  transition: transform 0.18s ease, box-shadow 0.18s ease, border-color 0.18s ease;
}

.metric:hover {
  transform: translateY(-2px);
  box-shadow: var(--shadow-md);
  border-color: var(--brand-border);
}

.metric::before {
  content: "";
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  height: 3px;
  background: linear-gradient(90deg, var(--blue), #38bdf8);
  opacity: 0.85;
}

.metric:nth-child(2)::before { background: linear-gradient(90deg, #10b981, #34d399); }
.metric:nth-child(3)::before { background: linear-gradient(90deg, #f59e0b, #fbbf24); }
.metric:nth-child(4)::before { background: linear-gradient(90deg, #6366f1, #818cf8); }

.metric::after {
  content: "";
  position: absolute;
  top: -18px;
  right: -18px;
  width: 72px;
  height: 72px;
  border-radius: 50%;
  background: radial-gradient(circle, color-mix(in srgb, var(--blue) 9%, transparent) 0%, transparent 70%);
  pointer-events: none;
}

.metric span {
  color: var(--muted);
  font-size: 12.5px;
  font-weight: 600;
  letter-spacing: 0.01em;
}

.metric strong {
  display: block;
  font-size: 30px;
  font-weight: 750;
  line-height: 1.25;
  margin: 6px 0 4px;
  color: var(--ink);
  letter-spacing: -0.03em;
  font-variant-numeric: tabular-nums;
}

.metric small {
  font-size: 12px;
  color: var(--subtle);
}

.split {
  display: grid;
  grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr);
  gap: 18px;
}

.list-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 14px;
  padding: 13px 0;
  border-bottom: 1px solid #edf2f9;
}

.list-row:last-child {
  border-bottom: 0;
  padding-bottom: 2px;
}

.list-row small {
  display: block;
  margin-top: 3px;
}

.bar {
  height: 8px;
  background: #edf2fa;
  border-radius: 999px;
  overflow: hidden;
}

.bar i {
  display: block;
  height: 100%;
  background: linear-gradient(90deg, var(--blue), #38bdf8);
  border-radius: inherit;
  transition: width 0.35s cubic-bezier(0.16, 1, 0.3, 1);
}

/* ==========================================================================
   Semantic Status Badges (with Subtle Indicator Dot)
   ========================================================================== */
.badge {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  border-radius: 999px;
  background: #f1f5f9;
  border: 1px solid #e2e8f0;
  padding: 2.5px 9px;
  font-size: 12px;
  font-weight: 600;
  line-height: 1.45;
  white-space: nowrap;
  color: #475569;
}

.badge::before {
  content: "";
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: currentColor;
  opacity: 0.75;
  flex-shrink: 0;
}

.badge.green {
  color: var(--green);
  background: var(--green-bg);
  border-color: var(--green-bd);
}

.badge.blue {
  color: var(--blue);
  background: var(--tint);
  border-color: var(--brand-border);
}

.badge.amber {
  color: var(--amber);
  background: var(--amber-bg);
  border-color: var(--amber-bd);
}

.badge.red {
  color: var(--red);
  background: var(--red-bg);
  border-color: var(--red-bd);
}

/* ==========================================================================
   Filters, Inputs & Modern Form Controls
   ========================================================================== */
.filters {
  padding: 14px 18px;
  gap: 10px;
  background: #fbfcfe;
  border-bottom: 1px solid var(--line);
}

.filters > label {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  font-size: 13px;
  font-weight: 600;
  color: var(--muted);
}

.filters > .badge {
  margin-left: auto;
}

input:not([type="checkbox"]):not([type="radio"]):not([type="color"]), select, textarea {
  border: 1px solid var(--line-strong);
  border-radius: 9px;
  background: var(--surface);
  color: var(--ink);
  font-size: 13.5px;
  padding: 7px 12px;
  min-height: 38px;
  box-shadow: var(--shadow-xs);
  transition: border-color 0.16s ease, box-shadow 0.16s ease, background-color 0.16s ease;
}

input:not([type="checkbox"]):not([type="radio"]):hover, select:hover, textarea:hover {
  border-color: #b4c6de;
}

input:not([type="checkbox"]):not([type="radio"]):focus, select:focus, textarea:focus {
  outline: none;
  border-color: var(--blue);
  box-shadow: 0 0 0 3px var(--brand-ring);
  background: #ffffff;
}

input[readonly] {
  background: #f5f8fc;
  color: var(--muted);
  border-color: var(--line);
}

input[type="search"] {
  min-width: 240px;
  padding-left: 35px;

.customer-group:last-child {

}

.customer-group summary {
  display: flex;

  padding: 15px 18px;

.customer-group summary::-webkit-details-marker {

.customer-group summary:hover {

   ========================================================================== */
dialog {

  color: var(--ink);

dialog > .section-head h2 {

function accLoad(key, def) {
  try {
    const raw = localStorage.getItem(key);
    return raw ? JSON.parse(raw) : structuredClone(def);
  } catch { return structuredClone(def); }
}
function accSave(key, val) {
  try { localStorage.setItem(key, JSON.stringify(val)); } catch {}
}
function accNow() {
  const d = new Date(), p = n => String(n).padStart(2,'0');
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
}
function accGetBalance(tid='OEM-001') {
  const map = accLoad(ACC_KEYS.balances, DEFAULT_BALANCES);
  return Number(map[tid] ?? 0);
}
function accRecharge(tid, amount, note, type='CRM 充值入账') {
  const map = accLoad(ACC_KEYS.balances, DEFAULT_BALANCES);
  const next = Number(((map[tid] ?? 0) + Number(amount)).toFixed(2));
  map[tid] = next;
  accSave(ACC_KEYS.balances, map);
  const recs = accLoad(ACC_KEYS.records, DEFAULT_RECORDS);
  recs.unshift({
    id: 'LS-' + (1010 + recs.length),
    time: accNow(), partner: tid, type,
    desc: note || 'CRM 签约订单充值入账',
    amount: Number(Number(amount).toFixed(2)),
    after: next
  });
  accSave(ACC_KEYS.records, recs);
  return next;
}
function accDeduct(tid, type, desc, cost) {
  const bal = accGetBalance(tid);
  if (bal < cost) {
    return { ok: false, balance: bal, msg: `账户余额不足（当前余额 ¥${bal.toFixed(2)}，本次需扣 ¥${Number(cost).toFixed(2)}），请先通过 CRM 充值入账。` };
  }
  const map = accLoad(ACC_KEYS.balances, DEFAULT_BALANCES);
  const next = Number((bal - Number(cost)).toFixed(2));
  map[tid] = next;
  accSave(ACC_KEYS.balances, map);
  const recs = accLoad(ACC_KEYS.records, DEFAULT_RECORDS);
  recs.unshift({
    id: 'LS-' + (1007 + recs.length),
    time: accNow(), partner: tid, type, desc,
    amount: -Number(Number(cost).toFixed(2)),
    after: next
  });
  accSave(ACC_KEYS.records, recs);
  return { ok: true, balance: next };
}

const BASE_REC_IDS = new Set(DEFAULT_RECORDS.map(r => r.id));
function getPeriodBillingRows(period) {
  const baseRows = (billingPeriods[period] || []).map(row => ({ ...row }));
  if (period !== Object.keys(billingPeriods)[0]) return baseRows;
  const byPartner = new Map(baseRows.map(r => [r.partner, r]));
  const recs = accLoad(ACC_KEYS.records, DEFAULT_RECORDS);
  for (const r of recs) {
    if (BASE_REC_IDS.has(r.id) || r.amount >= 0) continue;
    let row = byPartner.get(r.partner);
    if (!row) {
      row = { partner: r.partner, baseOrders: 0, articles: 0, keywordTool: 0, baseline: 0, presales: 0, crawlCount: 0, sourceSpend: 0 };
      byPartner.set(r.partner, row);
      baseRows.push(row);
    }
    const cents = Math.round(Math.abs(Number(r.amount) || 0) * 100);
    const partner = findPartner(r.partner);
    if (r.type === '新建订单' || r.type === '订单续费') {
      row.baseOrders += cents;
    } else if (r.type === 'AI 生文') {
      const m = String(r.desc || '').match(/×\s*(\d+)/);
      const unit = priceFor(partner, billingItems[0]) || 350;
      row.articles += m ? Number(m[1]) : Math.max(1, Math.round(cents / unit));
    } else if (r.type === '选词工具') {
      row.keywordTool += 1;
    } else if (r.type === '售前基线测算') {
      row.baseline += 1;
    } else if (r.type === '售前报告') {
      row.presales += 1;
    } else if (r.type === '爬虫消耗') {
      const m = String(r.desc || '').match(/×\s*(\d+)/);
      const unit = priceFor(partner, billingItems[4]) || 200;
      row.crawlCount += m ? Number(m[1]) : Math.max(1, Math.round(cents / unit));
    } else if (r.type === 'API 调用') {
      const d = String(r.desc || '');
      if (d.includes('生文')) row.articles += 1;
      else if (d.includes('基线')) row.baseline += 1;
      else if (d.includes('诊断')) row.presales += 1;
      else if (d.includes('爬虫')) row.crawlCount += 1;
      else row.keywordTool += 1;
    } else if (r.type === '信源发稿') {
      const mult = (priceFor(partner, billingItems[5]) || 120) / 100;
      row.sourceSpend += mult > 0 ? Math.round(cents / mult) : cents;
    }
  }
  return baseRows;
}

const quantity = number => number.toLocaleString('zh-CN');
const priceFor = (partner,item) => partner?.prices?.[item.key] ?? item.price;
const itemAmount = (bill,item) => {
  const val = priceFor(findPartner(bill.partner),item);
  return item.mode==='markup' ? Math.round((bill[item.key]||0) * val / 100) : (bill[item.key]||0) * val;
};
const billAmount = bill => (bill.baseOrders||0) + billingItems.reduce((sum,item)=>sum+itemAmount(bill,item),0);
function priceInputFields(partner) {
  const unitItems = billingItems.filter(i => i.mode !== 'markup');
  const markupItems = billingItems.filter(i => i.mode === 'markup');
  const srcVal = priceFor(partner, markupItems[0]) / 100;
  return `<fieldset class="wide hq-price-fields" style="grid-template-columns:repeat(2,minmax(0,1fr))"><legend>一、新建订单基础价（建单时扣费）</legend>
    ${basePriceItems.map(item => `<label>${item.name}（元/${item.unit}）
      <input type="number" name="price-${item.key}" min="0" max="1000000" step="10" required
      value="${(priceFor(partner,item)/100).toFixed(2)}"></label>`).join('')}
  </fieldset>
  <fieldset class="wide hq-price-fields" style="grid-template-columns:repeat(2,minmax(0,1fr))"><legend>二、按篇 / 按次服务单价</legend>
    ${unitItems.map(item => `<label>${item.name === '生文' ? 'AI 生文' : (item.name === '爬虫' ? '爬虫消耗' : item.name)}单价（元/${item.unit}）
      <input type="number" name="price-${item.key}" min="0" max="1000000" step="0.01" required
      value="${(priceFor(partner,item)/100).toFixed(2)}"></label>`).join('')}
  </fieldset>
  <fieldset class="wide hq-price-fields" style="grid-template-columns:repeat(2,minmax(0,1fr))"><legend>三、整体溢价倍数（仅超管可见）</legend>
    ${markupItems.map(item => `<label>${item.key==='sourceSpend'?'信源发布':item.name}溢价倍数（倍）
      <input type="number" name="price-${item.key}" min="0" max="100" step="0.05" required
      value="${(priceFor(partner,item)/100).toFixed(2)}"></label>`).join('')}
    <div class="hq-markup-hint" data-markup-preview>
      <span>信源发布示例：原成本 ¥1,000 → 实扣代理商 <b>¥${(1000 * srcVal).toFixed(2)}</b>（${srcVal.toFixed(2)} 倍）</span>
    </div>
    <small>倍数 1.00 为原价，1.20 为 1.2 倍；爬虫已按次单独定价，仅信源发布按整体溢价倍数结算，代理商及客户端不可见溢价。</small>
  </fieldset>`;
}
function pricesFrom(formData) {
  const prices = {};
  for (const item of allConfigPriceItems) {
    const amount = formData.get('price-'+item.key);
    const cents = Math.round(Number(amount)*100);
    if (amount===null || !/^\d+(?:\.\d{1,2})?$/.test(amount) || cents>100000000) return null;
    prices[item.key]=cents;
  }
  return prices;
}
const billingFilter = {period:Object.keys(billingPeriods)[0],partner:''};
function billingPage() { return hqSimpleBillingPage(); }
function showBillingDetail(partnerId) {
  const bill = getPeriodBillingRows(billingFilter.period).find(row=>row.partner===partnerId);
  if (!bill) return;
  const total = billAmount(bill);
  const partner = findPartner(partnerId);
  modal((partner?.name||partnerId)+' · 消费明细（'+esc(billingFilter.period)+'）',
    table(['项目','用量 / 原成本','单价 / 溢价','小计'],[
      ['<b>建单 / 续费基础费</b>','当期汇总','按版本 × 时长',billMoney(bill.baseOrders||0)],
      ...billingItems.map(item=>[
        `<b>${item.name}</b>`,
        item.mode==='markup' ? '成本 '+billMoney(bill[item.key]) : quantity(bill[item.key]||0)+' '+item.unit,
        item.mode==='markup' ? (priceFor(partner,item)/100).toFixed(2)+' 倍' : billMoney(priceFor(partner,item))+' / '+item.unit,
        billMoney(itemAmount(bill,item))
      ])
    ])+details([['本期合计',billMoney(total)]]));
}
function updateBillingFilter(field,value) {
  billingFilter[field]=value;
  render();
  $(field==='period'?'#billing-period':'#billing-partner')?.focus();
}

render();
const hqQuery = new URLSearchParams(location.search);
if (hqQuery.get('open') === 'pricing') openPriceModal(findPartner(hqQuery.get('partner') || 'OEM-001'));

</script>
</body>
